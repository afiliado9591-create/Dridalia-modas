```html
<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Dridalia Moda Feminina | Loja Virtual Oficial</title>
  <meta name="description" content="Compre moda feminina elegante, conjuntos e lançamentos na Dridalia Moda Feminina.">
  
  <!-- TAILWIND CSS & FONTAWESOME -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ALPINE.JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .font-grife { font-family: 'Playfair Display', Georgia, serif; }
    .aspect-product { aspect-ratio: 3 / 4; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans" x-data="dridaliaApp()">

  <!-- POP-UP PROMOCIONAL DINÂMICO -->
  <div x-show="config.popupAtivo && popupVisivel" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl relative">
      <button @click="popupVisivel = false" class="absolute top-3 right-3 bg-gray-900/60 hover:bg-gray-900 text-white w-8 h-8 rounded-full flex items-center justify-center z-10 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <template x-if="config.popupImagem">
        <img :src="config.popupImagem" alt="Oferta Especial" class="w-full h-56 object-cover">
      </template>
      <div class="p-6 text-center space-y-3">
        <span class="bg-rose-100 text-rose-800 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider" x-text="config.popupTag || 'Oferta Especial'"></span>
        <h3 class="text-xl font-bold text-gray-900 font-grife" x-text="config.popupTitulo"></h3>
        <p class="text-xs text-gray-600 leading-relaxed" x-text="config.popupTexto"></p>
        <button @click="popupVisivel = false" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-lg transition">Aproveitar Agora</button>
      </div>
    </div>
  </div>

  <!-- HEADER DRIDALIA MODA FEMININA -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      
      <div class="flex items-center space-x-3">
        <button @click="menuLateralAberto = true" class="p-2 text-gray-700 hover:text-rose-600 rounded-lg transition" title="Abrir Menu">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>

        <div class="flex items-center space-x-3 cursor-pointer" @click="painelAberto = false">
          <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-rose-200 shadow-sm bg-rose-50 flex-shrink-0">
            <img :src="config.logo || 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=200'" alt="Logo Dridalia" class="w-full h-full object-cover">
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-gray-900 font-grife leading-tight" x-text="config.nomeLoja"></h1>
            <p class="text-[10px] uppercase tracking-widest text-rose-600 font-semibold" x-text="config.subtituloLoja || 'Moda Feminina'"></p>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-3 sm:space-x-4">
        <button @click="clicarMinhaConta()" class="flex items-center space-x-2 text-xs sm:text-sm font-semibold text-gray-700 hover:text-black bg-gray-100 hover:bg-gray-200 px-3.5 py-2 rounded-full transition">
          <i class="fa-solid fa-user-circle text-base text-rose-600"></i>
          <span x-text="usuario.logado ? usuario.nome : 'Entrar / Criar Conta'"></span>
        </button>

        <button @click="carrinhoAberto = true" class="relative p-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-full transition">
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span x-show="carrinho.length > 0" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white" x-text="carrinho.reduce((acc, item) => acc + item.qtd, 0)"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- MENU LATERAL -->
  <div x-show="menuLateralAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-start" x-cloak>
    <div class="bg-white w-full max-w-xs h-full shadow-2xl flex flex-col justify-between">
      <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm flex items-center"><i class="fa-solid fa-bars mr-2 text-rose-500"></i>Menu Institucional</h3>
        <button @click="menuLateralAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-3">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Políticas da Loja</p>
        <button @click="abrirPaginaInstitucional('privacidade')" class="w-full text-left p-3 hover:bg-rose-50 text-xs font-semibold text-gray-700 rounded-xl transition flex items-center space-x-2">
          <i class="fa-solid fa-shield-halved text-rose-600"></i><span>Política de Privacidade</span>
        </button>
        <button @click="abrirPaginaInstitucional('entrega')" class="w-full text-left p-3 hover:bg-rose-50 text-xs font-semibold text-gray-700 rounded-xl transition flex items-center space-x-2">
          <i class="fa-solid fa-truck text-rose-600"></i><span>Política de Frete e Entrega</span>
        </button>
        <button @click="abrirPaginaInstitucional('devolucao')" class="w-full text-left p-3 hover:bg-rose-50 text-xs font-semibold text-gray-700 rounded-xl transition flex items-center space-x-2">
          <i class="fa-solid fa-rotate-left text-rose-600"></i><span>Política de Trocas e Devoluções</span>
        </button>

        <template x-if="paginasAdmin.length > 0">
          <div class="pt-4 border-t space-y-2">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Páginas Especiais</p>
            <template x-for="pag in paginasAdmin" :key="pag.id">
              <button @click="abrirPaginaDinamica(pag)" class="w-full text-left p-3 hover:bg-gray-100 text-xs font-semibold text-gray-800 rounded-xl transition flex items-center space-x-2">
                <i class="fa-solid fa-file-lines text-blue-600"></i><span x-text="pag.titulo"></span>
              </button>
            </template>
          </div>
        </template>
      </div>

      <div class="p-4 border-t bg-gray-50 text-center text-[10px] text-gray-500">
        <p x-text="config.nomeLoja + ' © 2026'"></p>
      </div>
    </div>
  </div>

  <!-- MODAL DE VISUALIZAÇÃO DE PÁGINAS -->
  <div x-show="modalPaginaAberto" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm" x-text="paginaAtual.titulo"></h3>
        <button @click="modalPaginaAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="p-6 overflow-y-auto space-y-4 flex-1">
        <template x-if="paginaAtual.imagem">
          <img :src="paginaAtual.imagem" alt="Imagem Ilustrativa" class="w-full h-48 object-cover rounded-2xl shadow-sm">
        </template>
        <p class="text-xs text-gray-700 whitespace-pre-line leading-relaxed" x-text="paginaAtual.descricao"></p>
        
        <template x-if="paginaAtual.link">
          <a :href="paginaAtual.link" class="block w-full py-3 bg-rose-600 hover:bg-rose-700 text-white text-center font-bold text-xs rounded-xl shadow transition">Acessar / Comprar Agora</a>
        </template>
      </div>
    </div>
  </div>

  <!-- BANNER PRINCIPAL -->
  <section x-show="config.banner" class="relative w-full bg-gray-900 overflow-hidden">
    <img :src="config.banner" alt="Banner Destaque" class="w-full h-48 md:h-80 object-cover opacity-85">
  </section>

  <!-- VITRINE DE PRODUTOS -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <template x-for="prod in produtos" :key="prod.id">
        <article class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-lg transition duration-300 relative" x-data="{ imgAtiva: 0, corSel: prod.cores ? prod.cores[0] : '', tamSel: prod.tamanhos ? prod.tamanhos[0] : '' }">
          
          <template x-if="usuario.logado && usuario.email === adminEmail">
            <div class="bg-gray-900 p-2 text-white flex justify-between items-center text-[10px] space-x-1 z-20">
              <span class="text-rose-400 font-mono" x-text="prod.id"></span>
              <button @click="excluirProduto(prod.id)" class="bg-red-600 hover:bg-red-700 px-2.5 py-1 rounded-lg font-bold transition flex items-center space-x-1">
                <i class="fa-solid fa-trash"></i><span>Excluir</span>
              </button>
            </div>
          </template>

          <div class="relative aspect-product bg-gray-100 overflow-hidden group/galeria">
            <img :src="(prod.imagens && prod.imagens.length > 0) ? prod.imagens[imgAtiva] : prod.imagem" :alt="prod.nome" class="w-full h-full object-cover transition duration-500" loading="lazy">
            
            <button @click="falarTexto(prod.nome + '. ' + prod.descricao)" class="absolute top-3 right-3 bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded-full shadow-lg backdrop-blur-md transition z-10 flex items-center space-x-1" title="Ouvir Áudio">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>

            <button x-show="usuario.logado" @click="compartilharProduto(prod)" class="absolute top-3 left-3 bg-gray-900 hover:bg-black text-white p-2.5 rounded-full shadow-md transition z-10" title="Copiar link">
              <i class="fa-solid fa-share-nodes text-xs"></i>
            </button>

            <template x-if="prod.imagens && prod.imagens.length > 1">
              <div>
                <button @click="imgAtiva = (imgAtiva === 0) ? prod.imagens.length - 1 : imgAtiva - 1" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center transition">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button @click="imgAtiva = (imgAtiva === prod.imagens.length - 1) ? 0 : imgAtiva + 1" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center transition">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
              </div>
            </template>
          </div>

          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h2 class="font-bold text-gray-900 text-base line-clamp-1" x-text="prod.nome"></h2>
              <p class="text-xs text-gray-500 line-clamp-2 mt-1" x-text="prod.descricao"></p>
            </div>

            <div class="space-y-2 border-t pt-2">
              <div class="flex items-center justify-between text-[11px]">
                <span class="font-bold text-gray-600">Tamanho:</span>
                <div class="flex space-x-1">
                  <template x-for="tam in (prod.tamanhos || ['P', 'M', 'G', 'GG'])" :key="tam">
                    <button @click="tamSel = tam" :class="tamSel === tam ? 'bg-rose-600 text-white font-bold' : 'bg-gray-100 text-gray-700'" class="px-2 py-0.5 rounded-md text-[10px] transition" x-text="tam"></button>
                  </template>
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px]">
                <span class="font-bold text-gray-600">Cor:</span>
                <div class="flex space-x-1">
                  <template x-for="cor in (prod.cores || ['Rosa', 'Preto', 'Nude'])" :key="cor">
                    <button @click="corSel = cor" :class="corSel === cor ? 'border-rose-600 font-bold text-rose-600 border-2' : 'border-gray-200 text-gray-600 border'" class="px-2 py-0.5 rounded-md text-[10px] bg-white transition" x-text="cor"></button>
                  </template>
                </div>
              </div>
            </div>

            <div>
              <span class="text-xl font-extrabold text-gray-900" x-text="'R$ ' + (prod.preco ? prod.preco.toFixed(2) : '0.00')"></span>

              <div class="grid grid-cols-2 gap-2 mt-3">
                <button @click="abrirChatbot(prod)" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 transition">
                  <i class="fa-solid fa-comments text-rose-600"></i><span>Dúvidas</span>
                </button>
                <button @click="adicionarAoCarrinho(prod, corSel, tamSel)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 shadow transition">
                  <i class="fa-solid fa-cart-plus"></i><span>Comprar</span>
                </button>
              </div>
            </div>
          </div>

        </article>
      </template>
    </div>
  </main>

  <!-- DRAWER DO CARRINHO & CHECKOUT -->
  <div x-show="carrinhoAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end" x-cloak>
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between">
      <div class="p-4 bg-gray-900 text-white flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-bag-shopping text-rose-500 text-xl"></i>
          <h3 class="font-bold text-base">Seu Carrinho & Checkout</h3>
        </div>
        <button @click="carrinhoAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-5">
        <template x-if="carrinho.length === 0">
          <div class="text-center py-12 text-gray-400 space-y-3">
            <i class="fa-solid fa-basket-shopping text-4xl"></i>
            <p class="text-sm">Seu carrinho está vazio.</p>
          </div>
        </template>

        <!-- ITENS -->
        <template x-for="(item, index) in carrinho" :key="index">
          <div class="flex items-center space-x-3 border-b pb-3">
            <img :src="(item.imagens && item.imagens.length > 0) ? item.imagens[0] : item.imagem" alt="Produto no Carrinho" class="w-16 h-16 object-cover rounded-xl border">
            <div class="flex-1">
              <h4 class="font-bold text-xs text-gray-900" x-text="item.nome"></h4>
              <div class="flex space-x-2 mt-0.5 text-[10px] text-gray-500">
                <span>Tam: <strong class="text-gray-800" x-text="item.tamanho"></strong></span>
                <span>•</span>
                <span>Cor: <strong class="text-gray-800" x-text="item.cor"></strong></span>
              </div>
              <p class="text-xs font-bold text-rose-600 mt-1" x-text="'R$ ' + (item.preco * item.qtd).toFixed(2)"></p>
              
              <div class="flex items-center space-x-2 mt-2">
                <button @click="alterarQtd(index, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-xs font-bold">-</button>
                <span class="text-xs font-bold" x-text="item.qtd"></span>
                <button @click="alterarQtd(index, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-xs font-bold">+</button>
              </div>
            </div>
            <button @click="removerDoCarrinho(index)" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </div>
        </template>

        <!-- ENDEREÇO -->
        <div x-show="carrinho.length > 0" class="bg-gray-50 p-4 rounded-2xl border space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-xs text-gray-900 flex items-center">
              <i class="fa-solid fa-location-dot text-rose-600 mr-1.5"></i>Endereço de Entrega
            </h4>
            <template x-if="enderecoSalvo">
              <button @click="editandoEndereco = !editandoEndereco" class="text-[10px] text-rose-600 font-bold underline">
                <span x-text="editandoEndereco ? 'Cancelar' : 'Alterar Endereço'"></span>
              </button>
            </template>
          </div>

          <template x-if="enderecoSalvo && !editandoEndereco">
            <div class="bg-white p-3 rounded-xl border text-xs space-y-1">
              <p class="font-bold text-gray-800" x-text="endereco.nomeCliente + ' (' + endereco.emailCliente + ')'"></p>
              <p class="text-gray-600" x-text="endereco.rua + ', ' + endereco.numero + ' - ' + endereco.bairro"></p>
              <p class="text-gray-600" x-text="endereco.cidade + '/' + endereco.estado + ' - CEP: ' + endereco.cep"></p>
              <p class="text-emerald-600 font-bold text-[11px] pt-1"><i class="fa-solid fa-truck mr-1"></i>Frete Calculado</p>
            </div>
          </template>

          <div x-show="!enderecoSalvo || editandoEndereco" class="space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" x-model="endereco.nomeCliente" placeholder="Nome Completo" class="p-2 border rounded-xl text-xs bg-white">
              <input type="email" x-model="endereco.emailCliente" placeholder="E-mail" class="p-2 border rounded-xl text-xs bg-white">
            </div>
            <div class="grid grid-cols-3 gap-2">
              <input type="text" x-model="endereco.cep" @keyup="buscarCep()" placeholder="CEP" class="p-2 border rounded-xl text-xs bg-white font-mono col-span-1">
              <input type="text" x-model="endereco.rua" placeholder="Rua" class="p-2 border rounded-xl text-xs bg-white col-span-2">
            </div>
            <div class="grid grid-cols-3 gap-2">
              <input type="text" x-model="endereco.numero" placeholder="Número" class="p-2 border rounded-xl text-xs bg-white">
              <input type="text" x-model="endereco.bairro" placeholder="Bairro" class="p-2 border rounded-xl text-xs bg-white col-span-2">
            </div>
            <div class="grid grid-cols-3 gap-2">
              <input type="text" x-model="endereco.cidade" placeholder="Cidade" class="p-2 border rounded-xl text-xs bg-white col-span-2">
              <input type="text" x-model="endereco.estado" placeholder="UF" class="p-2 border rounded-xl text-xs bg-white uppercase">
            </div>
            <button @click="salvarEndereco()" class="w-full py-2 bg-gray-900 text-white text-xs font-bold rounded-xl shadow">Confirmar Endereço</button>
          </div>
        </div>
      </div>

      <div class="p-4 border-t bg-gray-50 space-y-3" x-show="carrinho.length > 0">
        <div class="space-y-1.5 text-xs text-gray-600">
          <div class="flex justify-between">
            <span>Subtotal:</span>
            <span class="font-bold text-gray-900" x-text="'R$ ' + calcularSubtotal().toFixed(2)"></span>
          </div>
          <div class="flex justify-between">
            <span>Frete:</span>
            <span class="font-bold text-emerald-600" x-text="'R$ ' + valorFrete.toFixed(2)"></span>
          </div>
          <div class="flex justify-between items-center pt-1 border-t">
            <span class="font-bold text-sm text-gray-900">Total:</span>
            <span class="font-black text-xl text-rose-600" x-text="'R$ ' + (calcularSubtotal() + valorFrete).toFixed(2)"></span>
          </div>
        </div>

        <button @click="finalizarCompra()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-lock text-sm"></i>
          <span>PAGAR AGORA (MERCADO PAGO)</span>
        </button>
      </div>

    </div>
  </div>

  <!-- MODAL DE CONTA / PAINEL ADMIN -->
  <div x-show="painelAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="p-5 bg-gray-900 text-white flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-rose-600/20 flex items-center justify-center text-rose-400">
            <i class="fa-solid fa-user-circle text-xl"></i>
          </div>
          <div>
            <h2 class="font-bold text-lg" x-text="usuario.logado ? 'Sua Conta Dridalia' : (modoConta === 'login' ? 'Entrar na Conta' : 'Criar Conta')"></h2>
            <p class="text-xs text-gray-400" x-text="usuario.logado ? usuario.email : 'Acesse sua conta'"></p>
          </div>
        </div>
        <button @click="painelAberto = false" class="text-gray-400 hover:text-white p-2 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>

      <template x-if="usuario.logado">
        <div class="flex border-b border-gray-200 bg-gray-50 text-xs sm:text-sm overflow-x-auto">
          <button @click="abaPainel = 'compras'" :class="abaPainel === 'compras' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
            <i class="fa-solid fa-bag-shopping mr-1.5"></i>Minhas Compras
          </button>
          <button @click="abaPainel = 'afiliado'" :class="abaPainel === 'afiliado' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
            <i class="fa-solid fa-sack-dollar mr-1.5 text-emerald-600"></i>Painel de Afiliado
          </button>

          <template x-if="usuario.email === adminEmail">
            <div class="flex">
              <button @click="abaPainel = 'admin'" :class="abaPainel === 'admin' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-rose-50' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
                <i class="fa-solid fa-sliders mr-1.5 text-rose-600"></i>Admin Loja (Nuvem)
              </button>
            </div>

  <script>
    function dridaliaApp() {
      return {
        adminEmail: 'jeanaguiar636@gmail.com',
        workerUrl: 'https://dridalia-api.bmlimp8.workers.dev',

        painelAberto: false,
        carrinhoAberto: false,
        popupVisivel: true,
        chatbotAberto: false,
        menuLateralAberto: false,
        modalPaginaAberto: false,
        modoConta: 'login',
        abaPainel: 'compras',

        formLogin: { email: '', senha: '' },
        formCadastro: { nome: '', email: '', senha: '' },

        usuario: {
          logado: false,
          nome: '',
          email: '',
          codigoAfiliado: '',
          ganhosAfiliado: 0,
          vendasAfiliado: 0
        },

        enderecoSalvo: false,
        editandoEndereco: false,
        valorFrete: 15.00,
        endereco: { nomeCliente: '', emailCliente: '', cep: '', rua: '', numero: '', bairro: '', cidade: '', estado: '' },

        config: {
          nomeLoja: 'Dridalia',
          subtituloLoja: 'Moda Feminina',
          logo: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=200',
          banner: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200',
          popupAtivo: true,
          popupTag: 'Oferta Especial',
          popupTitulo: 'Conjunto em Destaque!',
          popupTexto: 'Aproveite o preço promocional exclusivo.',
          popupImagem: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600',
          mercadopagoPublicKey: '',
          mercadopagoAccessToken: '',
          freteEmpresa: 'superfrete',
          cepOrigem: '',
          freteToken: ''
        },

        novoProd: { nome: '', preco: null, img1: '', descricao: '' },
        paginaAtual: { titulo: '', imagem: '', descricao: '', link: '' },
        paginasAdmin: [],
        produtos: [],
        carrinho: [],

        async init() {
          const sessao = localStorage.getItem('dridalia_sessao');
          if (sessao) { try { this.usuario = JSON.parse(sessao); } catch(e) {} }

          const end = localStorage.getItem('dridalia_endereco');
          if (end) { try { this.endereco = JSON.parse(end); this.enderecoSalvo = true; } catch(e) {} }

          const car = localStorage.getItem('dridalia_carrinho');
          if (car) { try { this.carrinho = JSON.parse(car); } catch(e) {} }

          try {
            const resConfig = await fetch(this.workerUrl + '/api/config');
            const dataConfig = await resConfig.json();
            if (dataConfig && Object.keys(dataConfig).length > 0) {
              this.config = { ...this.config, ...dataConfig };
            }
          } catch(err) {
            console.error('Erro ao carregar config da nuvem:', err);
          }

          try {
            const resProd = await fetch(this.workerUrl + '/api/produtos');
            const dataProd = await resProd.json();
            if (Array.isArray(dataProd)) {
              this.produtos = dataProd;
            }
          } catch(err) {
            console.error('Erro ao carregar produtos da nuvem:', err);
          }
        },

        async salvarConfiguracoes() {
          try {
            const res = await fetch(this.workerUrl + '/api/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.config)
            });
            if (res.ok) {
              alert('Configurações e Pop-up salvos com sucesso na nuvem!');
            } else {
              alert('Erro ao salvar no servidor.');
            }
          } catch(err) {
            alert('Erro de conexão: ' + err.message);
          }
        },

        async adicionarProduto() {
          if (!this.novoProd.nome || !this.novoProd.preco || !this.novoProd.img1) {
            alert('Preencha nome, preço e a imagem principal.');
            return;
          }
          const novoObj = {
            id: 'prod_' + Date.now(),
            nome: this.novoProd.nome,
            preco: parseFloat(this.novoProd.preco),
            descricao: this.novoProd.descricao,
            tamanhos: ['P', 'M', 'G', 'GG'],
            cores: ['Rosa', 'Preto', 'Nude'],
            imagens: [this.novoProd.img1].filter(Boolean),
            faqs: []
          };

          try {
            const res = await fetch(this.workerUrl + '/api/produtos', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(novoObj)
            });
            if (res.ok) {
              this.produtos.push(novoObj);
              this.novoProd = { nome: '', preco: null, img1: '', descricao: '' };
              alert('Produto cadastrado com sucesso na nuvem!');
            } else {
              alert('Erro ao salvar produto.');
            }
          } catch(err) {
            alert('Erro de conexão: ' + err.message);
          }
        },

        async excluirProduto(id) {
          if (confirm('Deseja excluir este produto da nuvem?')) {
            try {
              const res = await fetch(this.workerUrl + '/api/produtos/' + id, { method: 'DELETE' });
              if (res.ok) {
                this.produtos = this.produtos.filter(p => p.id !== id);
                alert('Produto excluído com sucesso!');
              } else {
                alert('Erro ao excluir produto no servidor.');
              }
            } catch(err) {
              alert('Erro ao excluir: ' + err.message);
            }
          }
        },

        buscarCep() {
          let cep = this.endereco.cep.replace(/\D/g, '');
          if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
              .then(res => res.json())
              .then(data => {
                if (!data.erro) {
                  this.endereco.rua = data.logradouro;
                  this.endereco.bairro = data.bairro;
                  this.endereco.cidade = data.localidade;
                  this.endereco.estado = data.uf;
                }
              });
          }
        },

        salvarEndereco() {
          if (!this.endereco.nomeCliente || !this.endereco.cep || !this.endereco.rua || !this.endereco.numero) {
            alert('Preencha o endereço.');
            return;
          }
          if (!this.usuario.logado) {
            const cod = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
            this.usuario = { logado: true, nome: this.endereco.nomeCliente, email: this.endereco.emailCliente || 'cliente@dridalia.com', codigoAfiliado: cod, ganhosAfiliado: 0, vendasAfiliado: 0 };
            localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          }
          localStorage.setItem('dridalia_endereco', JSON.stringify(this.endereco));
          this.enderecoSalvo = true;
          this.editandoEndereco = false;
        },

        abrirChatbot(prod) {
          alert(`Dúvidas sobre ${prod.nome}? Entre em contato conosco!`);
        },

        clicarMinhaConta() { this.painelAberto = true; if (!this.usuario.logado) this.modoConta = 'login'; },

        fazerLogin() {
          if (!this.formLogin.email || !this.formLogin.senha) return;
          const cod = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = { logado: true, nome: this.formLogin.email.split('@')[0], email: this.formLogin.email.toLowerCase(), codigoAfiliado: cod, ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
        },

        fazerCadastro() {
          if (!this.formCadastro.nome || !this.formCadastro.email || !this.formCadastro.senha) return;
          const cod = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = { logado: true, nome: this.formCadastro.nome, email: this.formCadastro.email.toLowerCase(), codigoAfiliado: cod, ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          alert('Conta criada com sucesso!');
        },

        deslogar() {
          this.usuario = { logado: false, nome: '', email: '', codigoAfiliado: '', ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.removeItem('dridalia_sessao');
          this.painelAberto = false;
        },

        adicionarAoCarrinho(prod, cor, tamanho) {
          const idx = this.carrinho.findIndex(i => i.id === prod.id && i.cor === cor && i.tamanho === tamanho);
          if (idx > -1) { this.carrinho[idx].qtd++; } else { this.carrinho.push({ ...prod, cor: cor || 'Padrão', tamanho: tamanho || 'M', qtd: 1 }); }
          this.salvarCarrinho();
          this.carrinhoAberto = true;
        },

        alterarQtd(i, val) {
          this.carrinho[i].qtd += val;
          if (this.carrinho[i].qtd <= 0) { this.removerDoCarrinho(i); } else { this.salvarCarrinho(); }
        },

        removerDoCarrinho(i) { this.carrinho.splice(i, 1); this.salvarCarrinho(); },
        calcularSubtotal() { return this.carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0); },
        salvarCarrinho() { localStorage.setItem('dridalia_carrinho', JSON.stringify(this.carrinho)); },
        finalizarCompra() { alert('Redirecionando para pagamento seguro via Mercado Pago...'); },

        compartilharProduto(prod) {
          const link = window.location.origin + '?prod=' + prod.id + '&ref=' + this.usuario.codigoAfiliado;
          navigator.clipboard.writeText(link);
          alert('Link copiado para a área de transferência!');
        },

        falarTexto(txt) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(txt);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
          }
        }
      }
    }
  </script>
