<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Dridalia Moda Feminina | Loja Virtual Oficial</title>
  <meta name="description" content="Compre moda feminina elegante, conjuntos e lançamentos na Dridalia Moda Feminina.">
  
  <!-- TAILWIND CSS & FONTAWESOME -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ALPINE.JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .font-grife { font-family: 'Playfair Display', Georgia, serif; }
    .aspect-product { aspect-ratio: 3 / 4; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans" x-data="dridaliaApp()">

  <!-- POP-UP PROMOCIONAL DINÂMICO -->
  <div x-show="config.popupAtivo && popupVisivel" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl relative">
      <button @click="popupVisivel = false" class="absolute top-3 right-3 bg-gray-900/60 hover:bg-gray-900 text-white w-8 h-8 rounded-full flex items-center justify-center z-10">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <template x-if="config.popupImagem">
        <img :src="config.popupImagem" class="w-full h-56 object-cover">
      </template>
      <div class="p-6 text-center space-y-3">
        <span class="bg-rose-100 text-rose-800 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase" x-text="config.popupTag || 'Oferta Especial'"></span>
        <h3 class="text-xl font-bold text-gray-900" x-text="config.popupTitulo"></h3>
        <p class="text-xs text-gray-600" x-text="config.popupTexto"></p>
        <button @click="popupVisivel = false" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow">Aproveitar Agora</button>
      </div>
    </div>
  </div>

  <!-- HEADER DRIDALIA MODA FEMININA -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3 cursor-pointer" @click="painelAberto = false">
        <template x-if="config.logo">
          <img :src="config.logo" alt="Dridalia Logo" class="h-10 w-auto object-contain">
        </template>
        <h1 class="text-xl font-bold tracking-tight text-gray-900 font-grife" x-text="config.nomeLoja"></h1>
      </div>

      <div class="flex items-center space-x-3 sm:space-x-4">
        <button @click="clicarMinhaConta()" class="flex items-center space-x-2 text-xs sm:text-sm font-semibold text-gray-700 hover:text-black bg-gray-100 hover:bg-gray-200 px-3.5 py-2 rounded-full transition">
          <i class="fa-solid fa-user-circle text-base text-rose-600"></i>
          <span x-text="usuario.logado ? usuario.nome : 'Entrar / Criar Conta'"></span>
        </button>

        <button @click="carrinhoAberto = true" class="relative p-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-full transition">
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span x-show="carrinho.length > 0" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white" x-text="carrinho.reduce((acc, item) => acc + item.qtd, 0)"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- BANNER PRINCIPAL DA DRIDALIA -->
  <section x-show="config.banner" class="relative w-full bg-gray-900 overflow-hidden">
    <img :src="config.banner" alt="Banner Dridalia Moda Feminina" class="w-full h-48 md:h-80 object-cover opacity-85">
  </section>

  <!-- VITRINE DE PRODUTOS -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <template x-for="prod in produtos" :key="prod.id">
        <article class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-lg transition duration-300 relative" x-data="{ imgAtiva: 0, corSel: prod.cores ? prod.cores[0] : '', tamSel: prod.tamanhos ? prod.tamanhos[0] : '' }">
          
          <!-- BARRA DE CONTROLE DO ADMIN -->
          <template x-if="usuario.logado && usuario.email === adminEmail">
            <div class="bg-gray-900 p-2 text-white flex justify-between items-center text-[10px] space-x-1 z-20">
              <button @click="abrirEditarProduto(prod)" class="bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded font-bold transition flex items-center space-x-1">
                <i class="fa-solid fa-pen-to-square"></i><span>Editar</span>
              </button>
              <button @click="abrirFaqProduto(prod)" class="bg-amber-600 hover:bg-amber-700 px-2 py-1 rounded font-bold transition flex items-center space-x-1">
                <i class="fa-solid fa-comments"></i><span>FAQ Chat</span>
              </button>
              <button @click="excluirProduto(prod.id)" class="bg-red-600 hover:bg-red-700 px-2 py-1 rounded font-bold transition flex items-center space-x-1">
                <i class="fa-solid fa-trash"></i><span>Excluir</span>
              </button>
            </div>
          </template>

          <!-- GALERIA DE IMAGENS -->
          <div class="relative aspect-product bg-gray-100 overflow-hidden group/galeria">
            <img :src="prod.imagens[imgAtiva] || prod.imagem" :alt="prod.nome" class="w-full h-full object-cover transition duration-500" loading="lazy">
            
            <button @click="falarTexto(prod.nome + '. ' + prod.descricao)" class="absolute top-3 right-3 bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded-full shadow-lg backdrop-blur-md transition z-10 flex items-center space-x-1" title="Ouvir Descrição em Áudio">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>

            <!-- Botão Compartilhar / Gerar Link de Afiliado -->
            <button x-show="usuario.logado" @click="compartilharProduto(prod)" class="absolute top-3 left-3 bg-gray-900 hover:bg-black text-white p-2.5 rounded-full shadow-md transition z-10" title="Copiar link de Afiliado">
              <i class="fa-solid fa-share-nodes text-xs"></i>
            </button>

            <template x-if="prod.imagens && prod.imagens.length > 1">
              <div>
                <button @click="imgAtiva = (imgAtiva === 0) ? prod.imagens.length - 1 : imgAtiva - 1" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center transition">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button @click="imgAtiva = (imgAtiva === prod.imagens.length - 1) ? 0 : imgAtiva + 1" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center transition">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex space-x-1.5 z-10">
                  <template x-for="(img, idx) in prod.imagens" :key="idx">
                    <button @click="imgAtiva = idx" :class="imgAtiva === idx ? 'bg-rose-600 w-4' : 'bg-white/80 w-1.5'" class="h-1.5 rounded-full transition-all duration-300"></button>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- Informações -->
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h2 class="font-bold text-gray-900 text-base line-clamp-1" x-text="prod.nome"></h2>
            </div>

            <div class="space-y-2 border-t pt-2">
              <div class="flex items-center justify-between text-[11px]">
                <span class="font-bold text-gray-600">Tamanho:</span>
                <div class="flex space-x-1">
                  <template x-for="tam in (prod.tamanhos || ['P', 'M', 'G', 'GG'])" :key="tam">
                    <button @click="tamSel = tam" :class="tamSel === tam ? 'bg-rose-600 text-white font-bold' : 'bg-gray-100 text-gray-700'" class="px-2 py-0.5 rounded-md text-[10px] transition" x-text="tam"></button>
                  </template>
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px]">
                <span class="font-bold text-gray-600">Cor:</span>
                <div class="flex space-x-1">
                  <template x-for="cor in (prod.cores || ['Rosa', 'Preto', 'Nude'])" :key="cor">
                    <button @click="corSel = cor" :class="corSel === cor ? 'border-rose-600 font-bold text-rose-600 border-2' : 'border-gray-200 text-gray-600 border'" class="px-2 py-0.5 rounded-md text-[10px] bg-white transition" x-text="cor"></button>
                  </template>
                </div>
              </div>
            </div>

            <div>
              <span class="text-xl font-extrabold text-gray-900" x-text="'R$ ' + prod.preco.toFixed(2)"></span>

              <div class="grid grid-cols-2 gap-2 mt-3">
                <button @click="abrirChatbot(prod)" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 transition">
                  <i class="fa-solid fa-comments text-rose-600"></i>
                  <span>Dúvidas</span>
                </button>

                <button @click="adicionarAoCarrinho(prod, corSel, tamSel)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 shadow transition">
                  <i class="fa-solid fa-cart-plus"></i>
                  <span>Comprar</span>
                </button>
              </div>
            </div>
          </div>

        </article>
      </template>
    </div>
  </main>

  <!-- MODAL DE FAQ DO PRODUTO (ADMIN) -->
  <div x-show="modalFaqProdutoAberto" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="p-4 bg-amber-600 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm flex items-center">
          <i class="fa-solid fa-comments mr-2"></i>Perguntas do Produto: <span x-text="prodEditandoFaq ? prodEditandoFaq.nome : ''" class="ml-1 font-normal underline"></span>
        </h3>
        <button @click="modalFaqProdutoAberto = false" class="text-white hover:opacity-80"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 flex-1">
        <p class="text-xs text-gray-500">Cadastre perguntas e respostas específicas para este produto.</p>

        <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200 space-y-2">
          <label class="text-[10px] font-bold text-amber-900 uppercase">Adicionar Nova Pergunta</label>
          <input type="text" x-model="novaFaqProd.pergunta" placeholder="Ex: Este tecido estica?" class="w-full p-2 border rounded-xl text-xs bg-white">
          <textarea x-model="novaFaqProd.resposta" placeholder="Resposta..." class="w-full p-2 border rounded-xl text-xs bg-white h-16"></textarea>
          <button @click="adicionarFaqAoProduto()" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl shadow">Adicionar Pergunta</button>
        </div>

        <div class="space-y-2">
          <h4 class="font-bold text-xs text-gray-700">Perguntas Cadastradas:</h4>
          <template x-for="(f, i) in (prodEditandoFaq ? prodEditandoFaq.faqs || [] : [])" :key="i">
            <div class="p-3 bg-white border rounded-xl space-y-1 relative">
              <button @click="removerFaqDoProduto(i)" class="absolute top-2 right-2 text-red-500 text-xs p-1"><i class="fa-solid fa-trash-can"></i></button>
              <p class="font-bold text-xs text-gray-900 pr-6" x-text="f.pergunta"></p>
              <p class="text-xs text-gray-600" x-text="f.resposta"></p>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO DE PRODUTO (ADMIN COM 5 IMAGENS) -->
  <div x-show="modalEditProdutoAberto" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="p-4 bg-blue-600 text-white flex justify-between items-center">
        <h3 class="font-bold text-sm">Editar Produto (Até 5 Imagens)</h3>
        <button @click="modalEditProdutoAberto = false" class="text-white hover:opacity-80"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-5 overflow-y-auto space-y-3 flex-1" x-if="prodEmEdicao">
        <div>
          <label class="text-[10px] font-bold text-gray-600">Nome do Produto</label>
          <input type="text" x-model="prodEmEdicao.nome" class="w-full p-2 border rounded-xl text-xs bg-white">
        </div>
        <div>
          <label class="text-[10px] font-bold text-gray-600">Preço (R$)</label>
          <input type="number" x-model.number="prodEmEdicao.preco" class="w-full p-2 border rounded-xl text-xs bg-white">
        </div>

        <div class="space-y-1.5">
          <label class="text-[10px] font-bold text-gray-600">URLs das Imagens:</label>
          <input type="text" x-model="prodEmEdicao.img1" placeholder="URL Imagem 1" class="w-full p-2 border rounded-xl text-xs bg-white">
          <input type="text" x-model="prodEmEdicao.img2" placeholder="URL Imagem 2" class="w-full p-2 border rounded-xl text-xs bg-white">
          <input type="text" x-model="prodEmEdicao.img3" placeholder="URL Imagem 3" class="w-full p-2 border rounded-xl text-xs bg-white">
          <input type="text" x-model="prodEmEdicao.img4" placeholder="URL Imagem 4" class="w-full p-2 border rounded-xl text-xs bg-white">
          <input type="text" x-model="prodEmEdicao.img5" placeholder="URL Imagem 5" class="w-full p-2 border rounded-xl text-xs bg-white">
        </div>

        <div>
          <label class="text-[10px] font-bold text-gray-600">Descrição</label>
          <textarea x-model="prodEmEdicao.descricao" class="w-full p-2 border rounded-xl text-xs bg-white h-20"></textarea>
        </div>
        <button @click="salvarEdicaoProduto()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow mt-2">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <!-- MODAL DO CHATBOT -->
  <div x-show="chatbotAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[620px]">
      <div class="p-4 bg-gray-900 text-white flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-full bg-rose-600 flex items-center justify-center text-white font-bold text-sm">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm" x-text="produtoChat ? produtoChat.nome : 'Assistente Dridalia'"></h3>
            <p class="text-[10px] text-emerald-400 flex items-center"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1.5"></span>Atendente Virtual Online</p>
          </div>
        </div>
        <button @click="chatbotAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <template x-if="produtoChat">
        <div class="bg-rose-50/50 p-3 border-b flex items-center space-x-3" x-data="{ corChat: produtoChat.cores[0], tamChat: produtoChat.tamanhos[0] }">
          <img :src="produtoChat.imagens ? produtoChat.imagens[0] : produtoChat.imagem" class="w-16 h-16 object-cover rounded-xl border bg-white">
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-xs text-gray-900 truncate" x-text="produtoChat.nome"></h4>
            <p class="text-xs font-black text-rose-600" x-text="'R$ ' + produtoChat.preco.toFixed(2)"></p>
            
            <div class="flex space-x-2 mt-1">
              <select x-model="tamChat" class="text-[10px] p-1 border rounded bg-white font-semibold">
                <template x-for="t in produtoChat.tamanhos" :key="t"><option :value="t" x-text="t"></option></template>
              </select>
              <select x-model="corChat" class="text-[10px] p-1 border rounded bg-white font-semibold">
                <template x-for="c in produtoChat.cores" :key="c"><option :value="c" x-text="c"></option></template>
              </select>
            </div>
          </div>
          <button @click="adicionarAoCarrinho(produtoChat, corChat, tamChat); chatbotAberto = false;" class="px-3 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow transition whitespace-nowrap flex items-center space-x-1">
            <i class="fa-solid fa-cart-plus"></i>
            <span>Comprar</span>
          </button>
        </div>
      </template>

      <div class="p-4 overflow-y-auto flex-1 space-y-3 bg-gray-50">
        <template x-for="(msg, i) in chatMensagens" :key="i">
          <div :class="msg.tipo === 'usuario' ? 'justify-end' : 'justify-start'" class="flex">
            <div :class="msg.tipo === 'usuario' ? 'bg-rose-600 text-white rounded-br-none' : 'bg-white border text-gray-800 shadow-sm rounded-bl-none'" class="max-w-[80%] p-3 rounded-2xl text-xs space-y-1">
              <p x-text="msg.texto" class="whitespace-pre-line"></p>
            </div>
          </div>
        </template>
      </div>

      <div class="p-2.5 bg-white border-t space-y-2">
        <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
          <template x-for="(faq, index) in faqsParaExibir" :key="index">
            <button @click="selecionarFaq(faq)" class="text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 rounded-full font-medium transition">
              <span x-text="faq.pergunta"></span>
            </button>
          </template>
        </div>
      </div>

      <form @submit.prevent="enviarMensagemLivre()" class="p-3 bg-white border-t flex items-center space-x-2">
        <input type="text" x-model="mensagemChat" placeholder="Escreva sua dúvida aqui..." class="flex-1 p-2.5 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500">
        <button type="submit" class="p-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl shadow transition">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- DRAWER DO CARRINHO -->
  <div x-show="carrinhoAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end" x-cloak>
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between">
      <div class="p-4 bg-gray-900 text-white flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-bag-shopping text-rose-500 text-xl"></i>
          <h3 class="font-bold text-base">Seu Carrinho & Checkout</h3>
        </div>
        <button @click="carrinhoAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-5">
        <template x-if="carrinho.length === 0">
          <div class="text-center py-12 text-gray-400 space-y-3">
            <i class="fa-solid fa-basket-shopping text-4xl"></i>
            <p class="text-sm">Seu carrinho está vazio.</p>
          </div>
        </template>

        <template x-for="(item, index) in carrinho" :key="index">
          <div class="flex items-center space-x-3 border-b pb-3">
            <img :src="item.imagens ? item.imagens[0] : item.imagem" class="w-16 h-16 object-cover rounded-xl border">
            <div class="flex-1">
              <h4 class="font-bold text-xs text-gray-900" x-text="item.nome"></h4>
              <div class="flex space-x-2 mt-0.5 text-[10px] text-gray-500">
                <span>Tam: <strong class="text-gray-800" x-text="item.tamanho"></strong></span>
                <span>•</span>
                <span>Cor: <strong class="text-gray-800" x-text="item.cor"></strong></span>
              </div>
              <p class="text-xs font-bold text-rose-600 mt-1" x-text="'R$ ' + (item.preco * item.qtd).toFixed(2)"></p>
              
              <div class="flex items-center space-x-2 mt-2">
                <button @click="alterarQtd(index, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-xs font-bold">-</button>
                <span class="text-xs font-bold" x-text="item.qtd"></span>
                <button @click="alterarQtd(index, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-xs font-bold">+</button>
              </div>
            </div>
            <button @click="removerDoCarrinho(index)" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </div>
        </template>

        <div x-show="carrinho.length > 0" class="bg-gray-50 p-4 rounded-2xl border space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-bold text-xs text-gray-900 flex items-center">
              <i class="fa-solid fa-location-dot text-rose-600 mr-1.5"></i>Endereço de Entrega
            </h4>
            <template x-if="enderecoSalvo">
              <button @click="editandoEndereco = !editandoEndereco" class="text-[10px] text-rose-600 font-bold underline">
                <span x-text="editandoEndereco ? 'Cancelar' : 'Alterar Endereço'"></span>
              </button>
            </template>
          </div>

          <template x-if="enderecoSalvo && !editandoEndereco">
            <div class="bg-white p-3 rounded-xl border text-xs space-y-1">
              <p class="font-bold text-gray-800" x-text="endereco.nomeCliente + ' (' + endereco.emailCliente + ')'"></p>
              <p class="text-gray-600" x-text="endereco.rua + ', ' + endereco.numero + ' - ' + endereco.bairro"></p>
              <p class="text-gray-600" x-text="endereco.cidade + '/' + endereco.estado + ' - CEP: ' + endereco.cep"></p>

  <script>
    function dridaliaApp() {
      return {
        adminEmail: 'jeanaguiar636@gmail.com',

        painelAberto: false,
        carrinhoAberto: false,
        popupVisivel: true,
        chatbotAberto: false,
        modalFaqProdutoAberto: false,
        modalEditProdutoAberto: false,
        modoConta: 'login',
        abaPainel: 'compras',

        formLogin: { email: '', senha: '' },
        formCadastro: { nome: '', email: '', senha: '' },

        usuario: {
          logado: false,
          nome: '',
          email: '',
          codigoAfiliado: '',
          ganhosAfiliado: 0,
          vendasAfiliado: 0
        },

        enderecoSalvo: false,
        editandoEndereco: false,
        valorFrete: 15.00,
        endereco: { nomeCliente: '', emailCliente: '', cep: '', rua: '', numero: '', bairro: '', cidade: '', estado: '' },

        config: {
          nomeLoja: 'Dridalia Moda Feminina',
          logo: '',
          banner: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200',
          popupAtivo: true,
          popupTag: 'Oferta Especial',
          popupTitulo: 'Conjunto em Destaque!',
          popupTexto: 'Aproveite o preço promocional exclusivo.',
          popupImagem: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600',
          mercadopagoPublicKey: '',
          mercadopagoAccessToken: '',
          freteEmpresa: 'melhorenvio',
          freteToken: ''
        },

        faqsPadrao: [
          { pergunta: 'Qual o tecido / material?', resposta: 'Nossos produtos são confeccionados em tecidos nobres como moletinho premium e alfaiataria.' },
          { pergunta: 'Tabela de Tamanhos', resposta: 'Trabalhamos com P (36/38), M (40), G (42) e GG (44).' },
          { pergunta: 'Prazo de Entrega', resposta: 'Enviamos em até 24 horas úteis após a confirmação do pagamento.' }
        ],

        produtoChat: null,
        mensagemChat: '',
        chatMensagens: [],

        prodEditandoFaq: null,
        novaFaqProd: { pergunta: '', resposta: '' },
        prodEmEdicao: null,
        
        // 5 CAMPOS DE IMAGEM NO NOVO PRODUTO
        novoProd: { nome: '', preco: null, img1: '', img2: '', img3: '', img4: '', img5: '', descricao: '' },

        produtos: [
          {
            id: 1,
            nome: 'Conjunto Tati Moletinho Premium',
            preco: 189.90,
            descricao: 'Conjunto de moletinho super macio e elegante.',
            tamanhos: ['P', 'M', 'G', 'GG'],
            cores: ['Rosa', 'Preto', 'Nude'],
            imagens: [
              'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600',
              'https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=600'
            ],
            faqs: [{ pergunta: 'Encolhe?', resposta: 'Não encolhe na lavagem.' }]
          }
        ],

        carrinho: [],
        metricasCliques: [],

        init() {
          const cfg = localStorage.getItem('dridalia_config');
          if (cfg) this.config = JSON.parse(cfg);

          const prods = localStorage.getItem('dridalia_produtos');
          if (prods) this.produtos = JSON.parse(prods);

          const sessao = localStorage.getItem('dridalia_sessao');
          if (sessao) this.usuario = JSON.parse(sessao);

          const end = localStorage.getItem('dridalia_endereco');
          if (end) { this.endereco = JSON.parse(end); this.enderecoSalvo = true; }

          const car = localStorage.getItem('dridalia_carrinho');
          if (car) this.carrinho = JSON.parse(car);

          const met = localStorage.getItem('dridalia_metricas_cliques');
          if (met) this.metricasCliques = JSON.parse(met);

          const urlParams = new URLSearchParams(window.location.search);
          const refParam = urlParams.get('ref');
          const prodParam = urlParams.get('prod');

          if (refParam || prodParam) {
            const novoClique = {
              id: Date.now(),
              data: new Date().toLocaleString('pt-BR'),
              usuario: this.usuario.logado ? `${this.usuario.nome} (${this.usuario.email})` : 'Visitante Anônimo',
              ref: refParam ? refParam : 'Tráfego Direto',
              localizacao: 'Brasil (IP Rastreado)',
              origem: prodParam ? `Produto ID: ${prodParam}` : 'Acesso Geral à Loja'
            };

            this.metricasCliques.unshift(novoClique);
            localStorage.setItem('dridalia_metricas_cliques', JSON.stringify(this.metricasCliques));
          }
        },

        get faqsParaExibir() {
          if (this.produtoChat && this.produtoChat.faqs && this.produtoChat.faqs.length > 0) {
            return this.produtoChat.faqs;
          }
          return this.faqsPadrao;
        },

        limparMetricas() {
          if (confirm('Deseja limpar todo o histórico de cliques e métricas?')) {
            this.metricasCliques = [];
            localStorage.removeItem('dridalia_metricas_cliques');
          }
        },

        abrirFaqProduto(prod) {
          this.prodEditandoFaq = prod;
          if (!this.prodEditandoFaq.faqs) this.prodEditandoFaq.faqs = [];
          this.modalFaqProdutoAberto = true;
        },

        adicionarFaqAoProduto() {
          if (!this.novaFaqProd.pergunta || !this.novaFaqProd.resposta) return;
          this.prodEditandoFaq.faqs.push({ ...this.novaFaqProd });
          this.salvarProdutosStorage();
          this.novaFaqProd = { pergunta: '', resposta: '' };
        },

        removerFaqDoProduto(index) {
          this.prodEditandoFaq.faqs.splice(index, 1);
          this.salvarProdutosStorage();
        },

        abrirEditarProduto(prod) {
          this.prodEmEdicao = {
            id: prod.id,
            nome: prod.nome,
            preco: prod.preco,
            descricao: prod.descricao,
            tamanhos: prod.tamanhos || ['P', 'M', 'G', 'GG'],
            cores: prod.cores || ['Rosa', 'Preto', 'Nude'],
            img1: prod.imagens && prod.imagens[0] ? prod.imagens[0] : '',
            img2: prod.imagens && prod.imagens[1] ? prod.imagens[1] : '',
            img3: prod.imagens && prod.imagens[2] ? prod.imagens[2] : '',
            img4: prod.imagens && prod.imagens[3] ? prod.imagens[3] : '',
            img5: prod.imagens && prod.imagens[4] ? prod.imagens[4] : '',
            faqs: prod.faqs || []
          };
          this.modalEditProdutoAberto = true;
        },

        salvarEdicaoProduto() {
          const idx = this.produtos.findIndex(p => p.id === this.prodEmEdicao.id);
          if (idx > -1) {
            const imgs = [this.prodEmEdicao.img1, this.prodEmEdicao.img2, this.prodEmEdicao.img3, this.prodEmEdicao.img4, this.prodEmEdicao.img5].filter(Boolean);
            
            this.produtos[idx] = {
              id: this.prodEmEdicao.id,
              nome: this.prodEmEdicao.nome,
              preco: this.prodEmEdicao.preco,
              descricao: this.prodEmEdicao.descricao,
              tamanhos: this.prodEmEdicao.tamanhos,
              cores: this.prodEmEdicao.cores,
              imagens: imgs,
              faqs: this.prodEmEdicao.faqs
            };

            this.salvarProdutosStorage();
            this.modalEditProdutoAberto = false;
            alert('Produto atualizado com sucesso!');
          }
        },

        excluirProduto(id) {
          if (confirm('Deseja excluir este produto?')) {
            this.produtos = this.produtos.filter(p => p.id !== id);
            this.salvarProdutosStorage();
          }
        },

        salvarProdutosStorage() {
          localStorage.setItem('dridalia_produtos', JSON.stringify(this.produtos));
        },

        buscarCep() {
          let cep = this.endereco.cep.replace(/\D/g, '');
          if (cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
              .then(res => res.json())
              .then(data => {
                if (!data.erro) {
                  this.endereco.rua = data.logradouro;
                  this.endereco.bairro = data.bairro;
                  this.endereco.cidade = data.localidade;
                  this.endereco.estado = data.uf;
                }
              });
          }
        },

        salvarEndereco() {
          if (!this.endereco.nomeCliente || !this.endereco.cep || !this.endereco.rua || !this.endereco.numero) {
            alert('Preencha os dados de endereço.');
            return;
          }
          if (!this.usuario.logado) {
            const cod = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
            this.usuario = { logado: true, nome: this.endereco.nomeCliente, email: this.endereco.emailCliente || 'cliente@dridalia.com', codigoAfiliado: cod, ganhosAfiliado: 0, vendasAfiliado: 0 };
            localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          }
          localStorage.setItem('dridalia_endereco', JSON.stringify(this.endereco));
          this.enderecoSalvo = true;
          this.editandoEndereco = false;
        },

        abrirChatbot(prod) {
          this.produtoChat = prod;
          this.chatMensagens = [{ tipo: 'bot', texto: `Olá! Como posso ajudar com "${prod.nome}"?` }];
          this.chatbotAberto = true;
        },

        selecionarFaq(faq) {
          this.chatMensagens.push({ tipo: 'usuario', texto: faq.pergunta });
          setTimeout(() => { this.chatMensagens.push({ tipo: 'bot', texto: faq.resposta }); }, 300);
        },

        enviarMensagemLivre() {
          if (!this.mensagemChat.trim()) return;
          const txt = this.mensagemChat;
          this.chatMensagens.push({ tipo: 'usuario', texto: txt });
          this.mensagemChat = '';
          setTimeout(() => {
            this.chatMensagens.push({ tipo: 'bot', texto: `Obrigada pela pergunta! Nossa equipe responderá em breve.` });
          }, 500);
        },

        clicarMinhaConta() { this.painelAberto = true; if (!this.usuario.logado) this.modoConta = 'login'; },

        fazerLogin() {
          if (!this.formLogin.email || !this.formLogin.senha) return;
          const cod = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = { logado: true, nome: this.formLogin.email.split('@')[0], email: this.formLogin.email.toLowerCase(), codigoAfiliado: cod, ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
        },

        fazerCadastro() {
          if (!this.formCadastro.nome || !this.formCadastro.email || !this.formCadastro.senha) return;
          const cod = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = { logado: true, nome: this.formCadastro.nome, email: this.formCadastro.email.toLowerCase(), codigoAfiliado: cod, ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          alert('Conta criada com sucesso!');
        },

        deslogar() {
          this.usuario = { logado: false, nome: '', email: '', codigoAfiliado: '', ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.removeItem('dridalia_sessao');
          this.painelAberto = false;
        },

        adicionarAoCarrinho(prod, cor, tamanho) {
          const idx = this.carrinho.findIndex(i => i.id === prod.id && i.cor === cor && i.tamanho === tamanho);
          if (idx > -1) { this.carrinho[idx].qtd++; } else { this.carrinho.push({ ...prod, cor: cor || 'Padrão', tamanho: tamanho || 'M', qtd: 1 }); }
          this.salvarCarrinho();
          this.carrinhoAberto = true;
        },

        alterarQtd(i, val) {
          this.carrinho[i].qtd += val;
          if (this.carrinho[i].qtd <= 0) { this.removerDoCarrinho(i); } else { this.salvarCarrinho(); }
        },

        removerDoCarrinho(i) { this.carrinho.splice(i, 1); this.salvarCarrinho(); },
        calcularSubtotal() { return this.carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0); },
        salvarCarrinho() { localStorage.setItem('dridalia_carrinho', JSON.stringify(this.carrinho)); },
        finalizarCompra() { alert('Redirecionando para pagamento seguro...'); },

        compartilharProduto(prod) {
          const link = window.location.origin + '?prod=' + prod.id + '&ref=' + this.usuario.codigoAfiliado;
          this.copiarTexto(link);
        },

        copiarTexto(txt) {
          navigator.clipboard.writeText(txt);
          alert('Link copiado com sucesso!');
        },

        adicionarProduto() {
          if (!this.novoProd.nome || !this.novoProd.preco || !this.novoProd.img1) {
            alert('Preencha nome, preço e pelo menos a imagem 1.');
            return;
          }
          const imgs = [this.novoProd.img1, this.novoProd.img2, this.novoProd.img3, this.novoProd.img4, this.novoProd.img5].filter(Boolean);
          
          this.produtos.push({
            id: Date.now(),
            nome: this.novoProd.nome,
            preco: this.novoProd.preco,
            descricao: this.novoProd.descricao,
            tamanhos: ['P', 'M', 'G', 'GG'],
            cores: ['Rosa', 'Preto', 'Nude'],
            imagens: imgs,
            faqs: []
          });

          this.salvarProdutosStorage();
          this.novoProd = { nome: '', preco: null, img1: '', img2: '', img3: '', img4: '', img5: '', descricao: '' };
          alert('Produto cadastrado com sucesso!');
        },

        salvarConfiguracoes() {
          localStorage.setItem('dridalia_config', JSON.stringify(this.config));
          alert('Configurações salvas!');
        },

        falarTexto(txt) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(txt);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
          }
        }
      }
    }
  </script>
</body>
