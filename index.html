<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO DRIDALIA MODA FEMININA -->
  <title>Dridalia Moda Feminina | Loja Virtual Oficial</title>
  <meta name="description" content="Compre moda feminina elegante, conjuntos e lançamentos na Dridalia Moda Feminina.">
  
  <!-- TAILWIND CSS & FONTAWESOME -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ALPINE.JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .font-grife { font-family: 'Playfair Display', Georgia, serif; }
    .aspect-product { aspect-ratio: 3 / 4; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans" x-data="dridaliaApp()">

  <!-- POP-UP PROMOCIONAL (CONFIGURADO PELO ADMIN) -->
  <div x-show="config.popupAtivo && popupVisivel" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl relative animate-bounce-short">
      <button @click="popupVisivel = false" class="absolute top-3 right-3 bg-gray-900/60 hover:bg-gray-900 text-white w-8 h-8 rounded-full flex items-center justify-center z-10">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <template x-if="config.popupImagem">
        <img :src="config.popupImagem" class="w-full h-48 object-cover">
      </template>
      <div class="p-6 text-center space-y-3">
        <h3 class="text-xl font-bold text-gray-900" x-text="config.popupTitulo"></h3>
        <p class="text-xs text-gray-600" x-text="config.popupTexto"></p>
        <button @click="popupVisivel = false" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow">Aproveitar Agora</button>
      </div>
    </div>
  </div>

  <!-- HEADER DRIDALIA MODA FEMININA -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Logo e Marca -->
      <div class="flex items-center space-x-3 cursor-pointer" @click="painelAberto = false">
        <template x-if="config.logo">
          <img :src="config.logo" alt="Dridalia Logo" class="h-10 w-auto object-contain">
        </template>
        <h1 class="text-xl font-bold tracking-tight text-gray-900 font-grife" x-text="config.nomeLoja"></h1>
      </div>

      <!-- Menu de Ações -->
      <div class="flex items-center space-x-3 sm:space-x-4">
        <!-- BOTÃO "MINHA CONTA" -->
        <button @click="clicarMinhaConta()" class="flex items-center space-x-2 text-xs sm:text-sm font-semibold text-gray-700 hover:text-black bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-full transition">
          <i class="fa-solid fa-user-circle text-base text-rose-600"></i>
          <span x-text="usuario.logado ? 'Minha Conta' : 'Entrar / Criar Conta'"></span>
        </button>

        <!-- Carrinho de Compras -->
        <button @click="carrinhoAberto = true" class="relative p-2 text-gray-700 hover:text-black transition" aria-label="Abrir Carrinho">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span x-show="carrinho.length > 0" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full" x-text="carrinho.reduce((acc, item) => acc + item.qtd, 0)"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- BANNER PRINCIPAL DA DRIDALIA -->
  <section x-show="config.banner" class="relative w-full bg-gray-900 overflow-hidden">
    <img :src="config.banner" alt="Banner Dridalia Moda Feminina" class="w-full h-48 md:h-80 object-cover opacity-85">
  </section>

  <!-- VITRINE DE PRODUTOS -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <template x-for="prod in produtos" :key="prod.id">
        <article class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-lg transition duration-300 relative">
          
          <!-- Imagem + Voz -->
          <div class="relative aspect-product bg-gray-100 overflow-hidden">
            <img :src="prod.imagem" :alt="prod.nome" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
            
            <button @click="falarTexto(prod.nome + '. ' + prod.descricao)" class="absolute top-3 right-3 bg-black/60 hover:bg-black text-white p-2.5 rounded-full backdrop-blur-md transition shadow" title="Ouvir Descrição">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>

            <!-- Botão de Compartilhar Link de Afiliado (Apenas para Usuários Logados) -->
            <button x-show="usuario.logado" @click="compartilharProduto(prod)" class="absolute bottom-3 right-3 bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded-full shadow-md transition" title="Compartilhar com meu link de Afiliado">
              <i class="fa-solid fa-share-nodes text-xs"></i>
            </button>
          </div>

          <!-- Informações do Produto -->
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h2 class="font-bold text-gray-900 text-base line-clamp-1" x-text="prod.nome"></h2>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2" x-text="prod.descricao"></p>
            </div>

            <div class="mt-4">
              <span class="text-xl font-extrabold text-gray-900" x-text="'R$ ' + prod.preco.toFixed(2)"></span>

              <div class="grid grid-cols-2 gap-2 mt-3">
                <button @click="abrirChatbot(prod)" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 transition">
                  <i class="fa-solid fa-robot text-rose-600"></i>
                  <span>Dúvidas</span>
                </button>

                <!-- Comprar exige conta antes -->
                <button @click="comprarProduto(prod)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 shadow transition">
                  <i class="fa-solid fa-cart-plus"></i>
                  <span>Comprar</span>
                </button>
              </div>
            </div>
          </div>

        </article>
      </template>
    </div>
  </main>

  <!-- BOTÕES FLUTUANTES DINÂMICOS -->
  <div class="fixed bottom-6 right-6 z-40 flex flex-col space-y-3">
    <template x-for="btn in botoesFlutuantes" :key="btn.id">
      <a :href="btn.link" target="_blank" :title="btn.nome" class="w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-white text-xl transition transform hover:scale-110" :style="'background-color: ' + btn.cor">
        <i :class="btn.icone"></i>
      </a>
    </template>
  </div>

  <!-- MODAL DE CONTA (LOGIN / CADASTRO / PAINEL AFILIADO / ADMIN) -->
  <div x-show="painelAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="p-5 bg-gray-900 text-white flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-rose-600/20 flex items-center justify-center text-rose-400">
            <i class="fa-solid fa-user-circle text-xl"></i>
          </div>
          <div>
            <h2 class="font-bold text-lg" x-text="usuario.logado ? 'Sua Conta Dridalia' : (modoConta === 'login' ? 'Entrar na Conta' : 'Criar Nova Conta')"></h2>
            <p class="text-xs text-gray-400" x-text="usuario.logado ? usuario.email : 'Acesse para comprar e divulgar produtos'"></p>
          </div>
        </div>
        <button @click="painelAberto = false" class="text-gray-400 hover:text-white p-2 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>

      <!-- Abas quando LOGADO -->
      <template x-if="usuario.logado">
        <div class="flex border-b border-gray-200 bg-gray-50 text-xs sm:text-sm overflow-x-auto">
          <button @click="abaPainel = 'compras'" :class="abaPainel === 'compras' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
            <i class="fa-solid fa-bag-shopping mr-1.5"></i>Minhas Compras
          </button>

          <!-- PAINEL DE AFILIADO (AUTOMÁTICO PARA TODOS OS CLIENTES) -->
          <button @click="abaPainel = 'afiliado'" :class="abaPainel === 'afiliado' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
            <i class="fa-solid fa-sack-dollar mr-1.5 text-emerald-600"></i>Painel de Afiliado
          </button>

          <!-- PAINEL ADMIN (APENAS PARA O DONO DA LOJA) -->
          <template x-if="usuario.email === adminEmail">
            <button @click="abaPainel = 'admin'" :class="abaPainel === 'admin' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-rose-50' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
              <i class="fa-solid fa-sliders mr-1.5 text-rose-600"></i>Painel Admin
            </button>
          </template>

          <button @click="deslogar()" class="px-5 py-3.5 text-red-500 font-semibold ml-auto">Sair</button>
        </div>
      </template>

      <!-- Conteúdo Interno -->
      <div class="p-6 overflow-y-auto flex-1">
        
        <!-- FORMULÁRIOS SE NÃO ESTIVER LOGADO -->
        <template x-if="!usuario.logado">
          <div class="max-w-md mx-auto py-4 space-y-6">
            
            <!-- FORMULÁRIO DE LOGIN (E-mail e Senha) -->
            <div x-show="modoConta === 'login'" class="space-y-4">
              <div class="text-center">
                <h3 class="text-xl font-bold text-gray-900">Entrar na Minha Conta</h3>
                <p class="text-xs text-gray-500 mt-1">Digite seu e-mail e senha para acessar.</p>
              </div>

              <form @submit.prevent="fazerLogin()" class="space-y-3">
                <div>
                  <label class="text-xs font-semibold text-gray-600">E-mail</label>
                  <input type="email" x-model="formLogin.email" required placeholder="seuemail@exemplo.com" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-600">Senha</label>
                  <input type="password" x-model="formLogin.senha" required placeholder="******" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow transition">Entrar</button>
              </form>

              <div class="text-center pt-2">
                <p class="text-xs text-gray-600">Não tem uma conta ainda? 
                  <button @click="modoConta = 'cadastro'" class="text-rose-600 font-bold underline">Criar Conta</button>
                </p>
              </div>
            </div>

            <!-- FORMULÁRIO DE CADASTRO (Nome, E-mail e Senha) -->
            <div x-show="modoConta === 'cadastro'" class="space-y-4">
              <div class="text-center">
                <h3 class="text-xl font-bold text-gray-900">Criar Nova Conta</h3>
                <p class="text-xs text-gray-500 mt-1">Cadastre-se para comprar e se tornar um afiliado automaticamente.</p>
              </div>

              <form @submit.prevent="fazerCadastro()" class="space-y-3">
                <div>
                  <label class="text-xs font-semibold text-gray-600">Seu Nome Completo</label>
                  <input type="text" x-model="formCadastro.nome" required placeholder="Maria Silva" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-600">E-mail</label>
                  <input type="email" x-model="formCadastro.email" required placeholder="seuemail@exemplo.com" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-600">Criar Senha</label>
                  <input type="password" x-model="formCadastro.senha" required placeholder="******" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow transition">Cadastrar e Entrar</button>
              </form>

              <div class="text-center pt-2">
                <p class="text-xs text-gray-600">Já possui uma conta? 
                  <button @click="modoConta = 'login'" class="text-rose-600 font-bold underline">Entrar</button>
                </p>
              </div>
            </div>

          </div>
        </template>

        <!-- ÁREA INTERNA APÓS LOGAR -->
        <template x-if="usuario.logado">
          <div>
            <!-- COMPRAS -->
            <div x-show="abaPainel === 'compras'" class="space-y-4">
              <h3 class="font-bold text-gray-900 text-base">Seus Pedidos</h3>
              <div class="bg-gray-50 border border-dashed rounded-2xl p-8 text-center text-xs text-gray-500">
                <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-400"></i>
                <p>Nenhum pedido realizado ainda.</p>
              </div>
            </div>

            <!-- PAINEL DE AFILIADO COMPLETO -->
            <div x-show="abaPainel === 'afiliado'" class="space-y-5">
              <div class="border-b pb-3">
                <h3 class="text-lg font-bold text-gray-900 flex items-center">
                  <i class="fa-solid fa-sack-dollar text-emerald-600 mr-2"></i>Seu Painel de Afiliado Dridalia
                </h3>
                <p class="text-xs text-gray-500 mt-0.5">Você já é um afiliado! Compartilhe seu link e receba comissões automáticas.</p>
              </div>

              <!-- QUADROS DE GANHOS -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                  <span class="text-[10px] font-bold text-emerald-800 uppercase">Comissões Acumuladas</span>
                  <p class="text-xl font-bold text-emerald-600 mt-1" x-text="'R$ ' + usuario.ganhosAfiliado.toFixed(2)"></p>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl">
                  <span class="text-[10px] font-bold text-blue-800 uppercase">Vendas Indicadas</span>
                  <p class="text-xl font-bold text-blue-600 mt-1" x-text="usuario.vendasAfiliado"></p>
                </div>
                <div class="bg-purple-50 border border-purple-200 p-4 rounded-2xl">
                  <span class="text-[10px] font-bold text-purple-800 uppercase">Seu Código Único</span>
                  <p class="text-lg font-mono font-bold text-purple-600 mt-1" x-text="usuario.codigoAfiliado"></p>
                </div>
              </div>

              <!-- LINK DE INDICAÇÃO DA LOJA -->
              <div class="bg-gray-50 border p-4 rounded-2xl space-y-2">
                <label class="block text-xs font-semibold text-gray-700">Seu Link da Loja Completa</label>
                <div class="flex space-x-2">
                  <input type="text" readonly :value="window.location.origin + '?ref=' + usuario.codigoAfiliado" class="w-full p-2.5 border rounded-xl bg-white text-xs font-mono text-gray-700">
                  <button @click="copiarTexto(window.location.origin + '?ref=' + usuario.codigoAfiliado)" class="px-4 py-2.5 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl shadow transition">Copiar</button>
                </div>
              </div>
            </div>

            <!-- PAINEL ADMINISTRADOR COMPLETO DA LOJA -->
            <div x-show="abaPainel === 'admin'" class="space-y-6">
              <div class="border-b pb-3 flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-base">Gerenciamento Geral da Loja</h3>
                <span class="bg-rose-100 text-rose-800 text-[10px] px-2.5 py-1 rounded-full font-bold">Administrador</span>
              </div>

              <!-- GESTÃO DE BANNERS E LOGO -->
              <div class="bg-gray-50 p-4 rounded-2xl border space-y-3">
                <h4 class="font-bold text-xs text-gray-900"><i class="fa-solid fa-image text-rose-600 mr-1.5"></i>Banners e Identidade Visual</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <input type="text" x-model="config.logo" placeholder="URL do Logo" class="p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="config.banner" placeholder="URL do Banner Principal" class="p-2 border rounded-xl text-xs bg-white">
                </div>
              </div>

              <!-- GESTÃO DO POP-UP PROMOCIONAL -->
              <div class="bg-gray-50 p-4 rounded-2xl border space-y-3">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-xs text-gray-900"><i class="fa-solid fa-bullhorn text-amber-500 mr-1.5"></i>Pop-up Promocional</h4>
                  <label class="flex items-center space-x-2 cursor-pointer text-xs font-semibold">
                    <input type="checkbox" x-model="config.popupAtivo" class="rounded text-rose-600">
                    <span>Ativar Pop-up</span>
                  </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <input type="text" x-model="config.popupTitulo" placeholder="Título da Promoção" class="p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="config.popupImagem" placeholder="URL da Imagem do Pop-up" class="p-2 border rounded-xl text-xs bg-white">
                </div>
                <textarea x-model="config.popupTexto" placeholder="Texto da promoção..." class="w-full p-2 border rounded-xl text-xs bg-white h-16"></textarea>
              </div>

              <!-- GESTÃO DE PRODUTOS -->
              <div class="bg-gray-50 p-4 rounded-2xl border space-y-3">
                <h4 class="font-bold text-xs text-gray-900"><i class="fa-solid fa-plus-circle text-emerald-600 mr-1.5"></i>Cadastrar Novo Produto</h4>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <input type="text" x-model="novoProd.nome" placeholder="Nome do Produto" class="p-2 border rounded-xl text-xs bg-white">
                  <input type="number" x-model.number="novoProd.preco" placeholder="Preço (R$)" class="p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="novoProd.imagem" placeholder="URL da Imagem" class="p-2 border rounded-xl text-xs bg-white">
                </div>
                <textarea x-model="novoProd.descricao" placeholder="Descrição do produto..." class="w-full p-2 border rounded-xl text-xs bg-white h-16"></textarea>
                <button @click="adicionarProduto()" class="w-full py-2.5 bg-gray-900 text-white text-xs font-bold rounded-xl shadow">Cadastrar Produto</button>
              </div>

              <!-- BOTÃO DE SALVAR GERAL -->
              <button @click="salvarConfiguracoes()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">Salvar Alterações da Loja</button>
            </div>

          </div>
        </template>

      </div>
    </div>
  </div>

  <!-- RODAPÉ -->
  <footer class="bg-white border-t border-gray-200 py-8 mt-16 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p class="font-bold text-gray-800" x-text="config.nomeLoja + ' © 2026'"></p>
    </div>
  </footer>

  <!-- SCRIPT APLICAÇÃO DRIDALIA -->
  <script>
    function dridaliaApp() {
      return {
        // SUAS CONFIGURAÇÕES DA CLOUDFLARE E ADMIN
        WORKER_URL: 'https://dridalia-api.bmlimp8.workers.dev',
        adminEmail: 'jeanaguiar636@gmail.com',

        painelAberto: false,
        carrinhoAberto: false,
        popupVisivel: true,
        modoConta: 'login', // 'login' ou 'cadastro'
        abaPainel: 'compras', // 'compras', 'afiliado', 'admin'

        formLogin: { email: '', senha: '' },
        formCadastro: { nome: '', email: '', senha: '' },

        usuario: {
          logado: false,
          nome: '',
          email: '',
          codigoAfiliado: '',
          ganhosAfiliado: 0,
          vendasAfiliado: 0
        },

        config: {
          nomeLoja: 'Dridalia Moda Feminina',
          logo: '',
          banner: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200',
          popupAtivo: true,
          popupTitulo: 'Oferta Especial de Boas-Vindas!',
          popupTexto: 'Use o cupom BEMVINDA e ganhe 10% de desconto no seu primeiro pedido.',
          popupImagem: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600'
        },

        botoesFlutuantes: [
          { id: 1, nome: 'WhatsApp', icone: 'fa-brands fa-whatsapp', link: 'https://wa.me/5500000000000', cor: '#25D366' },
          { id: 2, nome: 'Zap Leve', icone: 'fa-solid fa-bolt', link: 'https://zapleve.com', cor: '#4F46E5' }
        ],

        novoProd: { nome: '', preco: null, imagem: '', descricao: '' },

        produtos: [
          {
            id: 1,
            nome: 'Conjunto Tati Moletinho Premium',
            preco: 189.90,
            descricao: 'Conjunto de moletinho super macio e elegante para o dia a dia.',
            imagem: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600'
          },
          {
            id: 2,
            nome: 'Vestido Midi Elegance Alfaiataria',
            preco: 239.90,
            descricao: 'Vestido midi fluido de alfaiataria com corte impecável.',
            imagem: 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600'
          }
        ],

        carrinho: [],

        init() {
          const cfg = localStorage.getItem('dridalia_config');
          if (cfg) this.config = JSON.parse(cfg);

          const prods = localStorage.getItem('dridalia_produtos');
          if (prods) this.produtos = JSON.parse(prods);

          const sessao = localStorage.getItem('dridalia_sessao');
          if (sessao) {
            this.usuario = JSON.parse(sessao);
          }
        },

        clicarMinhaConta() {
          this.painelAberto = true;
          if (!this.usuario.logado) {
            this.modoConta = 'login';
          }
        },

        fazerLogin() {
          if (!this.formLogin.email || !this.formLogin.senha) return;

          const codAfiliado = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = {
            logado: true,
            nome: this.formLogin.email.split('@')[0],
            email: this.formLogin.email,
            codigoAfiliado: codAfiliado,
            ganhosAfiliado: 0,
            vendasAfiliado: 0
          };

          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          this.formLogin = { email: '', senha: '' };
        },

        fazerCadastro() {
          if (!this.formCadastro.nome || !this.formCadastro.email || !this.formCadastro.senha) return;

          const codAfiliado = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = {
            logado: true,
            nome: this.formCadastro.nome,
            email: this.formCadastro.email,
            codigoAfiliado: codAfiliado,
            ganhosAfiliado: 0,
            vendasAfiliado: 0
          };

          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          this.formCadastro = { nome: '', email: '', senha: '' };
          alert('Conta criada com sucesso! Você já é um afiliado Dridalia.');
        },

        deslogar() {
          this.usuario = { logado: false, nome: '', email: '', codigoAfiliado: '', ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.removeItem('dridalia_sessao');
          this.painelAberto = false;
        },

        comprarProduto(prod) {
          if (!this.usuario.logado) {
            alert('Para realizar compras na Dridalia, crie uma conta ou faça login primeiro.');
            this.modoConta = 'cadastro';
            this.painelAberto = true;
            return;
          }
          this.carrinho.push({ ...prod, qtd: 1 });
          alert('Produto adicionado ao seu carrinho!');
        },

        compartilharProduto(prod) {
          const link = window.location.origin + '?prod=' + prod.id + '&ref=' + this.usuario.codigoAfiliado;
          this.copiarTexto(link);
        },

        copiarTexto(texto) {
          navigator.clipboard.writeText(texto);
          alert('Link de afiliado copiado com sucesso!');
        },

        adicionarProduto() {
          if (!this.novoProd.nome || !this.novoProd.preco || !this.novoProd.imagem) return;
          this.produtos.push({ id: Date.now(), ...this.novoProd });
          localStorage.setItem('dridalia_produtos', JSON.stringify(this.produtos));
          this.novoProd = { nome: '', preco: null, imagem: '', descricao: '' };
          alert('Produto cadastrado com sucesso!');
        },

        salvarConfiguracoes() {
          localStorage.setItem('dridalia_config', JSON.stringify(this.config));
          alert('Configurações da loja salvas com sucesso!');
        },

        falarTexto(texto) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(texto);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
          }
        }
      }
    }
  </script>
