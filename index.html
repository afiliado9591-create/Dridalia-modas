<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Dridalia Moda Feminina | Loja Virtual Oficial</title>
  <meta name="description" content="Compre moda feminina elegante, conjuntos e lançamentos na Dridalia Moda Feminina.">
  
  <!-- TAILWIND CSS & FONTAWESOME -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- ALPINE.JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .font-grife { font-family: 'Playfair Display', Georgia, serif; }
    .aspect-product { aspect-ratio: 3 / 4; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans" x-data="dridaliaApp()">

  <!-- POP-UP PROMOCIONAL -->
  <div x-show="config.popupAtivo && popupVisivel" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl relative">
      <button @click="popupVisivel = false" class="absolute top-3 right-3 bg-gray-900/60 hover:bg-gray-900 text-white w-8 h-8 rounded-full flex items-center justify-center z-10">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <template x-if="config.popupImagem">
        <img :src="config.popupImagem" class="w-full h-48 object-cover">
      </template>
      <div class="p-6 text-center space-y-3">
        <h3 class="text-xl font-bold text-gray-900" x-text="config.popupTitulo"></h3>
        <p class="text-xs text-gray-600" x-text="config.popupTexto"></p>
        <button @click="popupVisivel = false" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow">Aproveitar Agora</button>
      </div>
    </div>
  </div>

  <!-- HEADER DRIDALIA MODA FEMININA -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3 cursor-pointer" @click="painelAberto = false">
        <template x-if="config.logo">
          <img :src="config.logo" alt="Dridalia Logo" class="h-10 w-auto object-contain">
        </template>
        <h1 class="text-xl font-bold tracking-tight text-gray-900 font-grife" x-text="config.nomeLoja"></h1>
      </div>

      <div class="flex items-center space-x-3 sm:space-x-4">
        <button @click="clicarMinhaConta()" class="flex items-center space-x-2 text-xs sm:text-sm font-semibold text-gray-700 hover:text-black bg-gray-100 hover:bg-gray-200 px-3.5 py-2 rounded-full transition">
          <i class="fa-solid fa-user-circle text-base text-rose-600"></i>
          <span x-text="usuario.logado ? usuario.nome : 'Entrar / Criar Conta'"></span>
        </button>

        <button @click="carrinhoAberto = true" class="relative p-2.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-full transition">
          <i class="fa-solid fa-bag-shopping text-lg"></i>
          <span x-show="carrinho.length > 0" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white" x-text="carrinho.reduce((acc, item) => acc + item.qtd, 0)"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- BANNER PRINCIPAL DA DRIDALIA -->
  <section x-show="config.banner" class="relative w-full bg-gray-900 overflow-hidden">
    <img :src="config.banner" alt="Banner Dridalia Moda Feminina" class="w-full h-48 md:h-80 object-cover opacity-85">
  </section>

  <!-- VITRINE DE PRODUTOS -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <template x-for="prod in produtos" :key="prod.id">
        <article class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-lg transition duration-300 relative" x-data="{ imgAtiva: 0, corSel: prod.cores ? prod.cores[0] : '', tamSel: prod.tamanhos ? prod.tamanhos[0] : '' }">
          
          <!-- GALERIA COM ATÉ 5 IMAGENS (ROLAR LATERAL + ÁUDIO CONTÍNUO) -->
          <div class="relative aspect-product bg-gray-100 overflow-hidden group/galeria">
            <img :src="prod.imagens[imgAtiva] || prod.imagem" :alt="prod.nome" class="w-full h-full object-cover transition duration-500" loading="lazy">
            
            <!-- Botão de Ouvir Áudio da Descrição -->
            <button @click="falarTexto(prod.nome + '. ' + prod.descricao)" class="absolute top-3 right-3 bg-rose-600 hover:bg-rose-700 text-white p-2.5 rounded-full shadow-lg backdrop-blur-md transition z-10 flex items-center space-x-1" title="Ouvir Descrição">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>

            <!-- Botão de Compartilhar Link de Afiliado -->
            <button x-show="usuario.logado" @click="compartilharProduto(prod)" class="absolute top-3 left-3 bg-gray-900 hover:bg-black text-white p-2.5 rounded-full shadow-md transition z-10" title="Compartilhar com meu link de Afiliado">
              <i class="fa-solid fa-share-nodes text-xs"></i>
            </button>

            <!-- SETAS PARA ROLAR AS IMAGENS DE LADO -->
            <template x-if="prod.imagens && prod.imagens.length > 1">
              <div>
                <button @click="imgAtiva = (imgAtiva === 0) ? prod.imagens.length - 1 : imgAtiva - 1" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center transition">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button @click="imgAtiva = (imgAtiva === prod.imagens.length - 1) ? 0 : imgAtiva + 1" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center transition">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>

                <!-- INDICADORES DE FOTO (PONTOS) -->
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex space-x-1.5 z-10">
                  <template x-for="(img, idx) in prod.imagens" :key="idx">
                    <button @click="imgAtiva = idx" :class="imgAtiva === idx ? 'bg-rose-600 w-4' : 'bg-white/80 w-1.5'" class="h-1.5 rounded-full transition-all duration-300"></button>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- Informações do Produto -->
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h2 class="font-bold text-gray-900 text-base line-clamp-1" x-text="prod.nome"></h2>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2" x-text="prod.descricao"></p>
            </div>

            <!-- OPÇÕES DE TAMANHO E COR NA VITRINE -->
            <div class="space-y-2 border-t pt-2">
              <div class="flex items-center justify-between text-[11px]">
                <span class="font-bold text-gray-600">Tamanho:</span>
                <div class="flex space-x-1">
                  <template x-for="tam in (prod.tamanhos || ['P', 'M', 'G', 'GG'])" :key="tam">
                    <button @click="tamSel = tam" :class="tamSel === tam ? 'bg-rose-600 text-white font-bold' : 'bg-gray-100 text-gray-700'" class="px-2 py-0.5 rounded-md text-[10px] transition" x-text="tam"></button>
                  </template>
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px]">
                <span class="font-bold text-gray-600">Cor:</span>
                <div class="flex space-x-1">
                  <template x-for="cor in (prod.cores || ['Rosa', 'Preto', 'Nude'])" :key="cor">
                    <button @click="corSel = cor" :class="corSel === cor ? 'border-rose-600 font-bold text-rose-600 border-2' : 'border-gray-200 text-gray-600 border'" class="px-2 py-0.5 rounded-md text-[10px] bg-white transition" x-text="cor"></button>
                  </template>
                </div>
              </div>
            </div>

            <div>
              <span class="text-xl font-extrabold text-gray-900" x-text="'R$ ' + prod.preco.toFixed(2)"></span>

              <div class="grid grid-cols-2 gap-2 mt-3">
                <button @click="abrirChatbot(prod)" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 transition">
                  <i class="fa-solid fa-comments text-rose-600"></i>
                  <span>Dúvidas</span>
                </button>

                <!-- COMPRAR -> ADICIONA E ABRE CARRINHO NA HORA -->
                <button @click="adicionarAoCarrinho(prod, corSel, tamSel)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 shadow transition">
                  <i class="fa-solid fa-cart-plus"></i>
                  <span>Comprar</span>
                </button>
              </div>
            </div>
          </div>

        </article>
      </template>
    </div>
  </main>

  <!-- MODAL DO CHATBOT DE DÚVIDAS DO PRODUTO -->
  <div x-show="chatbotAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[580px]">
      <div class="p-4 bg-gray-900 text-white flex justify-between items-center border-b border-gray-800">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-full bg-rose-600 flex items-center justify-center text-white font-bold text-sm">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm" x-text="produtoChat ? produtoChat.nome : 'Assistente Dridalia'"></h3>
            <p class="text-[10px] text-emerald-400 flex items-center"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-1.5"></span>Atendente Virtual Online</p>
          </div>
        </div>
        <button @click="chatbotAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-3 bg-gray-50" id="chatContainer">
        <template x-for="(msg, i) in chatMensagens" :key="i">
          <div :class="msg.tipo === 'usuario' ? 'justify-end' : 'justify-start'" class="flex">
            <div :class="msg.tipo === 'usuario' ? 'bg-rose-600 text-white rounded-br-none' : 'bg-white border text-gray-800 shadow-sm rounded-bl-none'" class="max-w-[80%] p-3 rounded-2xl text-xs space-y-1">
              <p x-text="msg.texto" class="whitespace-pre-line"></p>
            </div>
          </div>
        </template>
      </div>

      <div class="p-2.5 bg-white border-t space-y-2">
        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block px-1">Perguntas Frequentes:</span>
        <div class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
          <template x-for="(faq, index) in faqsPadrao" :key="index">
            <button @click="selecionarFaq(faq)" class="text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 rounded-full font-medium transition">
              <span x-text="faq.pergunta"></span>
            </button>
          </template>
        </div>
      </div>

      <form @submit.prevent="enviarMensagemLivre()" class="p-3 bg-white border-t flex items-center space-x-2">
        <input type="text" x-model="mensagemChat" placeholder="Escreva sua dúvida aqui..." class="flex-1 p-2.5 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-rose-500">
        <button type="submit" class="p-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl shadow transition">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- DRAWER DO CARRINHO / CHECKOUT DE COMPRA -->
  <div x-show="carrinhoAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end" x-cloak>
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between">
      <div class="p-5 border-b bg-gray-900 text-white flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-bag-shopping text-rose-500 text-xl"></i>
          <h3 class="font-bold text-lg">Seu Carrinho & Checkout</h3>
        </div>
        <button @click="carrinhoAberto = false" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-5 overflow-y-auto flex-1 space-y-4">
        <template x-if="carrinho.length === 0">
          <div class="text-center py-12 text-gray-400 space-y-3">
            <i class="fa-solid fa-basket-shopping text-4xl"></i>
            <p class="text-sm">Seu carrinho está vazio.</p>
          </div>
        </template>

        <template x-for="(item, index) in carrinho" :key="index">
          <div class="flex items-center space-x-3 border-b pb-3">
            <img :src="item.imagens ? item.imagens[0] : item.imagem" class="w-16 h-16 object-cover rounded-xl border">
            <div class="flex-1">
              <h4 class="font-bold text-xs text-gray-900" x-text="item.nome"></h4>
              
              <!-- Exibição de Tamanho e Cor escolhidos -->
              <div class="flex space-x-2 mt-1 text-[10px] text-gray-500">
                <span>Tam: <strong class="text-gray-800" x-text="item.tamanho"></strong></span>
                <span>•</span>
                <span>Cor: <strong class="text-gray-800" x-text="item.cor"></strong></span>
              </div>

              <p class="text-xs font-bold text-rose-600 mt-1" x-text="'R$ ' + (item.preco * item.qtd).toFixed(2)"></p>
              
              <div class="flex items-center space-x-2 mt-2">
                <button @click="alterarQtd(index, -1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-xs font-bold">-</button>
                <span class="text-xs font-bold" x-text="item.qtd"></span>
                <button @click="alterarQtd(index, 1)" class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-xs font-bold">+</button>
              </div>
            </div>

            <button @click="removerDoCarrinho(index)" class="text-gray-400 hover:text-red-500 p-2"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </div>
        </template>
      </div>

      <div class="p-5 border-t bg-gray-50 space-y-3" x-show="carrinho.length > 0">
        <div class="space-y-1.5 text-xs text-gray-600">
          <div class="flex justify-between">
            <span>Subtotal:</span>
            <span class="font-bold text-gray-900" x-text="'R$ ' + calcularSubtotal().toFixed(2)"></span>
          </div>
          <div class="flex justify-between items-center pt-1 border-t">
            <span class="font-bold text-sm text-gray-900">Total:</span>
            <span class="font-black text-lg text-rose-600" x-text="'R$ ' + calcularSubtotal().toFixed(2)"></span>
          </div>
        </div>

        <button @click="finalizarCompra()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-lock text-sm"></i>
          <span>Finalizar Compra Segura</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CONTA / PAINEL ADMIN / AFILIADO -->
  <div x-show="painelAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <div class="p-5 bg-gray-900 text-white flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-rose-600/20 flex items-center justify-center text-rose-400">
            <i class="fa-solid fa-user-circle text-xl"></i>
          </div>
          <div>
            <h2 class="font-bold text-lg" x-text="usuario.logado ? 'Sua Conta Dridalia' : (modoConta === 'login' ? 'Entrar na Conta' : 'Criar Nova Conta')"></h2>
            <p class="text-xs text-gray-400" x-text="usuario.logado ? usuario.email : 'Acesse para comprar e divulgar produtos'"></p>
          </div>
        </div>
        <button @click="painelAberto = false" class="text-gray-400 hover:text-white p-2 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>

      <template x-if="usuario.logado">
        <div class="flex border-b border-gray-200 bg-gray-50 text-xs sm:text-sm overflow-x-auto">
          <button @click="abaPainel = 'compras'" :class="abaPainel === 'compras' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
            <i class="fa-solid fa-bag-shopping mr-1.5"></i>Minhas Compras
          </button>

          <button @click="abaPainel = 'afiliado'" :class="abaPainel === 'afiliado' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
            <i class="fa-solid fa-sack-dollar mr-1.5 text-emerald-600"></i>Painel de Afiliado
          </button>

          <template x-if="usuario.email === adminEmail">
            <button @click="abaPainel = 'admin'" :class="abaPainel === 'admin' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-rose-50' : 'text-gray-600'" class="px-5 py-3.5 font-semibold">
              <i class="fa-solid fa-sliders mr-1.5 text-rose-600"></i>Painel Admin (Dono)
            </button>
          </template>

          <button @click="deslogar()" class="px-5 py-3.5 text-red-500 font-semibold ml-auto">Sair</button>
        </div>
      </template>

      <div class="p-6 overflow-y-auto flex-1">
        <template x-if="!usuario.logado">
          <div class="max-w-md mx-auto py-4 space-y-6">
            <div x-show="modoConta === 'login'" class="space-y-4">
              <div class="text-center">
                <h3 class="text-xl font-bold text-gray-900">Entrar na Minha Conta</h3>
                <p class="text-xs text-gray-500 mt-1">Digite seu e-mail e senha para acessar.</p>
              </div>

              <form @submit.prevent="fazerLogin()" class="space-y-3">
                <div>
                  <label class="text-xs font-semibold text-gray-600">E-mail</label>
                  <input type="email" x-model="formLogin.email" required placeholder="seuemail@exemplo.com" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-600">Senha</label>
                  <input type="password" x-model="formLogin.senha" required placeholder="******" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow transition">Entrar</button>
              </form>

              <div class="text-center pt-2">
                <p class="text-xs text-gray-600">Não tem uma conta ainda? 
                  <button @click="modoConta = 'cadastro'" class="text-rose-600 font-bold underline">Criar Conta</button>
                </p>
              </div>
            </div>

            <div x-show="modoConta === 'cadastro'" class="space-y-4">
              <div class="text-center">
                <h3 class="text-xl font-bold text-gray-900">Criar Nova Conta</h3>
                <p class="text-xs text-gray-500 mt-1">Cadastre-se para comprar e se tornar um afiliado automaticamente.</p>
              </div>

              <form @submit.prevent="fazerCadastro()" class="space-y-3">
                <div>
                  <label class="text-xs font-semibold text-gray-600">Seu Nome Completo</label>
                  <input type="text" x-model="formCadastro.nome" required placeholder="Maria Silva" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-600">E-mail</label>
                  <input type="email" x-model="formCadastro.email" required placeholder="seuemail@exemplo.com" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <div>
                  <label class="text-xs font-semibold text-gray-600">Criar Senha</label>
                  <input type="password" x-model="formCadastro.senha" required placeholder="******" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-rose-500">
                </div>
                <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow transition">Cadastrar e Entrar</button>
              </form>

              <div class="text-center pt-2">
                <p class="text-xs text-gray-600">Já possui uma conta? 
                  <button @click="modoConta = 'login'" class="text-rose-600 font-bold underline">Entrar</button>
                </p>
              </div>
            </div>
          </div>
        </template>

        <template x-if="usuario.logado">
          <div>
            <div x-show="abaPainel === 'compras'" class="space-y-4">
              <h3 class="font-bold text-gray-900 text-base">Seus Pedidos</h3>
              <div class="bg-gray-50 border border-dashed rounded-2xl p-8 text-center text-xs text-gray-500">
                <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-400"></i>
                <p>Nenhum pedido realizado ainda.</p>
              </div>
            </div>

            <div x-show="abaPainel === 'afiliado'" class="space-y-5">
              <div class="border-b pb-3">
                <h3 class="text-lg font-bold text-gray-900 flex items-center">
                  <i class="fa-solid fa-sack-dollar text-emerald-600 mr-2"></i>Seu Painel de Afiliado
                </h3>
                <p class="text-xs text-gray-500 mt-0.5">Você já é um afiliado! Compartilhe seu link e receba comissões automáticas.</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                  <span class="text-[10px] font-bold text-emerald-800 uppercase">Comissões Acumuladas</span>
                  <p class="text-xl font-bold text-emerald-600 mt-1" x-text="'R$ ' + usuario.ganhosAfiliado.toFixed(2)"></p>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl">
                  <span class="text-[10px] font-bold text-blue-800 uppercase">Vendas Indicadas</span>
                  <p class="text-xl font-bold text-blue-600 mt-1" x-text="usuario.vendasAfiliado"></p>
                </div>
                <div class="bg-purple-50 border border-purple-200 p-4 rounded-2xl">
                  <span class="text-[10px] font-bold text-purple-800 uppercase">Seu Código Único</span>
                  <p class="text-lg font-mono font-bold text-purple-600 mt-1" x-text="usuario.codigoAfiliado"></p>
                </div>
              </div>

              <div class="bg-gray-50 border p-4 rounded-2xl space-y-2">
                <label class="block text-xs font-semibold text-gray-700">Seu Link da Loja Completa</label>
                <div class="flex space-x-2">
                  <input type="text" readonly :value="window.location.origin + '?ref=' + usuario.codigoAfiliado" class="w-full p-2.5 border rounded-xl bg-white text-xs font-mono text-gray-700">
                  <button @click="copiarTexto(window.location.origin + '?ref=' + usuario.codigoAfiliado)" class="px-4 py-2.5 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl shadow transition">Copiar</button>
                </div>
              </div>
            </div>

            <div x-show="abaPainel === 'admin'" class="space-y-6">
              <div class="border-b pb-3 flex justify-between items-center">
                <div>
                  <h3 class="font-bold text-gray-900 text-lg">Painel de Controle Administrador</h3>
                  <p class="text-xs text-gray-500">Gerencie produtos, integrações de frete e Mercado Pago.</p>
                </div>
                <span class="bg-rose-100 text-rose-800 text-[10px] px-3 py-1 rounded-full font-bold">Administrador Supremo</span>
              </div>

              <div class="bg-gray-50 p-4 rounded-2xl border space-y-3">
                <h4 class="font-bold text-xs text-gray-900"><i class="fa-solid fa-plus-circle text-emerald-600 mr-1.5"></i>Cadastrar Novo Produto (até 5 Imagens)</h4>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <input type="text" x-model="novoProd.nome" placeholder="Nome do Produto" class="p-2 border rounded-xl text-xs bg-white">
                  <input type="number" x-model.number="novoProd.preco" placeholder="Preço (R$)" class="p-2 border rounded-xl text-xs bg-white">
                </div>

                <div class="space-y-1.5">
                  <label class="text-[10px] font-bold text-gray-600">URLs das Imagens (Fotos para Rolar de lado):</label>
                  <input type="text" x-model="novoProd.img1" placeholder="URL da Imagem 1 (Principal)" class="w-full p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="novoProd.img2" placeholder="URL da Imagem 2 (Opcional)" class="w-full p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="novoProd.img3" placeholder="URL da Imagem 3 (Opcional)" class="w-full p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="novoProd.img4" placeholder="URL da Imagem 4 (Opcional)" class="w-full p-2 border rounded-xl text-xs bg-white">
                  <input type="text" x-model="novoProd.img5" placeholder="URL da Imagem 5 (Opcional)" class="w-full p-2 border rounded-xl text-xs bg-white">
                </div>

                <textarea x-model="novoProd.descricao" placeholder="Descrição do produto..." class="w-full p-2 border rounded-xl text-xs bg-white h-16"></textarea>
                <button @click="adicionarProduto()" class="w-full py-2.5 bg-gray-900 text-white text-xs font-bold rounded-xl shadow">Cadastrar Produto</button>
              </div>

              <button @click="salvarConfiguracoes()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg transition">Salvar Alterações da Loja</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <footer class="bg-white border-t border-gray-200 py-8 mt-16 text-center text-xs text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p class="font-bold text-gray-800" x-text="config.nomeLoja + ' © 2026'"></p>
    </div>
  </footer>

  <script>
    function dridaliaApp() {
      return {
        WORKER_URL: 'https://dridalia-api.bmlimp8.workers.dev',
        adminEmail: 'jeanaguiar636@gmail.com',

        painelAberto: false,
        carrinhoAberto: false,
        popupVisivel: true,
        chatbotAberto: false,
        modoConta: 'login',
        abaPainel: 'compras',

        formLogin: { email: '', senha: '' },
        formCadastro: { nome: '', email: '', senha: '' },

        usuario: {
          logado: false,
          nome: '',
          email: '',
          codigoAfiliado: '',
          ganhosAfiliado: 0,
          vendasAfiliado: 0
        },

        config: {
          nomeLoja: 'Dridalia Moda Feminina',
          logo: '',
          banner: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200',
          popupAtivo: true,
          popupTitulo: 'Oferta Especial de Boas-Vindas!',
          popupTexto: 'Use o cupom BEMVINDA e ganhe 10% de desconto no seu primeiro pedido.',
          popupImagem: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600',
          mercadopagoPublicKey: '',
          mercadopagoAccessToken: '',
          freteEmpresa: 'melhorenvio',
          freteToken: ''
        },

        faqsPadrao: [
          { pergunta: 'Qual o tecido / material?', resposta: 'Nossos produtos são confeccionados em tecidos nobres como moletinho premium, alfaiataria e algodão macio de altíssima durabilidade.' },
          { pergunta: 'Tabela de Tamanhos', resposta: 'Trabalhamos com os tamanhos P (36/38), M (40), G (42) e GG (44). O caimento é anatômico e super confortável.' },
          { pergunta: 'Prazo de Entrega', resposta: 'O prazo varia de acordo com o seu CEP, sendo enviado em até 24 horas úteis após a confirmação do pagamento.' },
          { pergunta: 'Trocas e Devoluções', resposta: 'Garantimos troca grátis em até 7 dias após o recebimento do produto sem complicações.' }
        ],

        produtoChat: null,
        mensagemChat: '',
        chatMensagens: [],

        novoProd: { nome: '', preco: null, img1: '', img2: '', img3: '', img4: '', img5: '', descricao: '' },

        produtos: [
          {
            id: 1,
            nome: 'Conjunto Tati Moletinho Premium',
            preco: 189.90,
            descricao: 'Conjunto de moletinho super macio e elegante para o dia a dia.',
            tamanhos: ['P', 'M', 'G', 'GG'],
            cores: ['Rosa', 'Preto', 'Nude', 'Branco'],
            imagens: [
              'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600',
              'https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=600',
              'https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600',
              'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=600',
              'https://images.unsplash.com/photo-1485230895905-ec40ba36b9bc?q=80&w=600'
            ]
          },
          {
            id: 2,
            nome: 'Vestido Midi Elegance Alfaiataria',
            preco: 239.90,
            descricao: 'Vestido midi fluido de alfaiataria com corte impecável.',
            tamanhos: ['P', 'M', 'G'],
            cores: ['Preto', 'Nude', 'Vinho'],
            imagens: [
              'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600',
              'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600',
              'https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=600'
            ]
          }
        ],

        carrinho: [],

        init() {
          const cfg = localStorage.getItem('dridalia_config');
          if (cfg) this.config = JSON.parse(cfg);

          const prods = localStorage.getItem('dridalia_produtos');
          if (prods) this.produtos = JSON.parse(prods);

          const faqs = localStorage.getItem('dridalia_faqs');
          if (faqs) this.faqsPadrao = JSON.parse(faqs);

          const sessao = localStorage.getItem('dridalia_sessao');
          if (sessao) this.usuario = JSON.parse(sessao);

          const car = localStorage.getItem('dridalia_carrinho');
          if (car) this.carrinho = JSON.parse(car);
        },

        abrirChatbot(prod) {
          this.produtoChat = prod;
          this.chatMensagens = [
            { tipo: 'bot', texto: `Olá! Sou a assistente da Dridalia. Como posso ajudar com o produto "${prod.nome}"?` }
          ];
          this.chatbotAberto = true;
        },

        selecionarFaq(faq) {
          this.chatMensagens.push({ tipo: 'usuario', texto: faq.pergunta });
          setTimeout(() => {
            this.chatMensagens.push({ tipo: 'bot', texto: faq.resposta });
          }, 300);
        },

        enviarMensagemLivre() {
          if (!this.mensagemChat.trim()) return;
          const texto = this.mensagemChat;
          this.chatMensagens.push({ tipo: 'usuario', texto: texto });
          this.mensagemChat = '';

          setTimeout(() => {
            this.chatMensagens.push({ 
              tipo: 'bot', 
              texto: `Obrigada por perguntar sobre "${this.produtoChat.nome}". Nossa equipe também pode te atender diretamente no WhatsApp se preferir!` 
            });
          }, 500);
        },

        clicarMinhaConta() {
          this.painelAberto = true;
          if (!this.usuario.logado) this.modoConta = 'login';
        },

        fazerLogin() {
          if (!this.formLogin.email || !this.formLogin.senha) return;
          const codAfiliado = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = {
            logado: true,
            nome: this.formLogin.email.split('@')[0],
            email: this.formLogin.email.toLowerCase(),
            codigoAfiliado: codAfiliado,
            ganhosAfiliado: 0,
            vendasAfiliado: 0
          };
          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          this.formLogin = { email: '', senha: '' };
        },

        fazerCadastro() {
          if (!this.formCadastro.nome || !this.formCadastro.email || !this.formCadastro.senha) return;
          const codAfiliado = 'DRI-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario = {
            logado: true,
            nome: this.formCadastro.nome,
            email: this.formCadastro.email.toLowerCase(),
            codigoAfiliado: codAfiliado,
            ganhosAfiliado: 0,
            vendasAfiliado: 0
          };
          localStorage.setItem('dridalia_sessao', JSON.stringify(this.usuario));
          this.formCadastro = { nome: '', email: '', senha: '' };
          alert('Conta criada com sucesso! Você já é um afiliado Dridalia.');
        },

        deslogar() {
          this.usuario = { logado: false, nome: '', email: '', codigoAfiliado: '', ganhosAfiliado: 0, vendasAfiliado: 0 };
          localStorage.removeItem('dridalia_sessao');
          this.painelAberto = false;
        },

        adicionarAoCarrinho(prod, cor, tamanho) {
          if (!this.usuario.logado) {
            alert('Para comprar na Dridalia, crie uma conta ou faça login primeiro.');
            this.modoConta = 'cadastro';
            this.painelAberto = true;
            return;
          }

          const index = this.carrinho.findIndex(item => item.id === prod.id && item.cor === cor && item.tamanho === tamanho);
          if (index > -1) {
            this.carrinho[index].qtd++;
          } else {
            this.carrinho.push({ ...prod, cor: cor || 'Padrão', tamanho: tamanho || 'M', qtd: 1 });
          }

          this.salvarCarrinho();
          this.carrinhoAberto = true; // ABRE O CARRINHO / CHECKOUT NA HORA
        },

        alterarQtd(index, valor) {
          this.carrinho[index].qtd += valor;
          if (this.carrinho[index].qtd <= 0) {
            this.removerDoCarrinho(index);
          } else {
            this.salvarCarrinho();
          }
        },

        removerDoCarrinho(index) {
          this.carrinho.splice(index, 1);
          this.salvarCarrinho();
        },

        calcularSubtotal() {
          return this.carrinho.reduce((acc, item) => acc + (item.preco * item.qtd), 0);
        },

        salvarCarrinho() {
          localStorage.setItem('dridalia_carrinho', JSON.stringify(this.carrinho));
        },

        finalizarCompra() {
          alert('Redirecionando para o Checkout com Mercado Pago e cálculo de frete...');
        },

        compartilharProduto(prod) {
          const link = window.location.origin + '?prod=' + prod.id + '&ref=' + this.usuario.codigoAfiliado;
          this.copiarTexto(link);
        },

        copiarTexto(texto) {
          navigator.clipboard.writeText(texto);
          alert('Link de afiliado copiado com sucesso!');
        },

        adicionarProduto() {
          if (!this.novoProd.nome || !this.novoProd.preco || !this.novoProd.img1) {
            alert('Por favor, preencha o nome, preço e pelo menos a imagem 1.');
            return;
          }

          const imgs = [this.novoProd.img1, this.novoProd.img2, this.novoProd.img3, this.novoProd.img4, this.novoProd.img5].filter(Boolean);

          this.produtos.push({
            id: Date.now(),
            nome: this.novoProd.nome,
            preco: this.novoProd.preco,
            descricao: this.novoProd.descricao,
            tamanhos: ['P', 'M', 'G', 'GG'],
            cores: ['Rosa', 'Preto', 'Nude'],
            imagens: imgs
          });

          localStorage.setItem('dridalia_produtos', JSON.stringify(this.produtos));
          this.novoProd = { nome: '', preco: null, img1: '', img2: '', img3: '', img4: '', img5: '', descricao: '' };
          alert('Produto cadastrado com sucesso!');
        },

        salvarConfiguracoes() {
          localStorage.setItem('dridalia_config', JSON.stringify(this.config));
          localStorage.setItem('dridalia_faqs', JSON.stringify(this.faqsPadrao));
          alert('Configurações da loja salvas com sucesso!');
        },

        falarTexto(texto) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(texto);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
          }
        }
      }
    }
  </script>
</body>
</html>
