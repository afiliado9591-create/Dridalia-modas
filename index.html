<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dridalia Moda Feminina | Loja Oficial</title>
<meta name="description" content="Moda feminina elegante, conjuntos e lançamentos na Dridalia.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>.grife{font-family:'Playfair Display',Georgia,serif}.ap{aspect-ratio:3/4}.sc::-webkit-scrollbar{display:none}[x-cloak]{display:none!important}</style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased" x-data="loja()" x-init="init()">

<!-- POPUP -->
<div x-show="cfg.popupAtivo && popup && (promo()||cfg.popupTitulo)" x-cloak class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden relative">
    <button @click="popup=false" class="absolute top-3 right-3 bg-gray-900/70 text-white w-8 h-8 rounded-full z-10"><i class="fa-solid fa-xmark"></i></button>
    <img x-show="promo()||cfg.popupImagem" :src="promo()?(promo().imagens||[])[0]:cfg.popupImagem" class="w-full h-56 object-cover">
    <div class="p-6 text-center space-y-3">
      <span class="bg-rose-100 text-rose-800 text-[10px] font-bold px-3 py-1 rounded-full uppercase" x-text="cfg.popupTag||'Oferta Especial'"></span>
      <h3 class="text-xl font-bold" x-text="promo()?promo().nome:cfg.popupTitulo"></h3>
      <p class="text-lg font-extrabold text-rose-600" x-show="promo()" x-text="promo()&&brl(promo().preco)"></p>
      <p class="text-xs text-gray-600" x-text="promo()?promo().descricao:cfg.popupTexto"></p>
      <button @click="promo()?(add(promo(),(promo().cores||[])[0],(promo().tamanhos||[])[0]),popup=false):(popup=false)" class="w-full py-3 bg-rose-600 text-white font-bold rounded-xl text-xs" x-text="promo()?'Comprar agora':'Aproveitar Agora'"></button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-white border-b shadow-sm">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <button @click="menu=true" aria-label="Menu" class="p-2 text-gray-700"><i class="fa-solid fa-bars text-xl"></i></button>
      <img x-show="cfg.logo" :src="cfg.logo" class="h-10" alt="Logo">
      <h1 class="text-lg font-bold grife" x-text="cfg.nomeLoja"></h1>
    </div>
    <div class="flex items-center space-x-2">
      <button @click="conta=true;if(user)carregarAf()" class="text-xs font-semibold bg-gray-100 px-3 py-2 rounded-full">
        <i class="fa-solid fa-user-circle text-rose-600 mr-1"></i><span x-text="user?user.nome.split(' ')[0]:'Entrar'"></span>
      </button>
      <button @click="carrinho=true" aria-label="Carrinho" class="relative p-2.5 bg-rose-50 text-rose-600 rounded-full">
        <i class="fa-solid fa-bag-shopping"></i>
        <span x-show="itens.length" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full" x-text="qtdTotal()"></span>
      </button>
    </div>
  </div>
</header>

<!-- MENU LATERAL -->
<div x-show="menu" x-cloak class="fixed inset-0 z-50 bg-black/60 flex" @click.self="menu=false">
  <div class="bg-white w-full max-w-xs h-full flex flex-col">
    <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
      <b class="text-sm">Menu</b><button @click="menu=false"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="p-4 space-y-1 overflow-y-auto flex-1 text-xs font-semibold">
      <template x-for="p in politicas" :key="p.titulo"><button @click="abrirPag(p)" class="w-full text-left p-3 hover:bg-rose-50 rounded-xl" x-text="p.titulo"></button></template>
      <template x-for="p in paginas" :key="p.id"><button @click="abrirPag(p)" class="w-full text-left p-3 hover:bg-gray-100 rounded-xl" x-text="p.titulo"></button></template>
    </div>
  </div>
</div>

<!-- PÁGINA -->
<div x-show="pag" x-cloak class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4" @click.self="pag=null">
  <div class="bg-white w-full max-w-lg rounded-3xl overflow-hidden flex flex-col max-h-[85vh]" x-show="pag">
    <div class="p-4 bg-gray-900 text-white flex justify-between"><b class="text-sm" x-text="pag&&pag.titulo"></b><button @click="pag=null"><i class="fa-solid fa-xmark text-xl"></i></button></div>
    <div class="p-6 overflow-y-auto space-y-4">
      <img x-show="pag&&pag.imagem" :src="pag&&pag.imagem" class="w-full h-48 object-cover rounded-2xl">
      <p class="text-xs whitespace-pre-line leading-relaxed" x-text="pag&&pag.descricao"></p>
      <a x-show="pag&&pag.link" :href="pag&&pag.link" class="block py-3 bg-rose-600 text-white text-center font-bold text-xs rounded-xl">Acessar</a>
    </div>
  </div>
</div>

<!-- BANNER -->
<section x-show="cfg.banner" class="bg-gray-900"><img :src="cfg.banner" alt="Banner" class="w-full h-48 md:h-80 object-cover opacity-90"></section>

<!-- VITRINE -->
<main class="max-w-7xl mx-auto px-4 py-8">
  <p x-show="carregando" class="text-center text-sm text-gray-400 py-12">Carregando...</p>
  <p x-show="!carregando && !produtos.length" class="text-center text-sm text-gray-400 py-12">Nenhum produto cadastrado ainda.</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <template x-for="p in produtos" :key="p.id">
      <article class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col" x-data="{i:0,cor:(p.cores||[])[0]||'',tam:(p.tamanhos||[])[0]||''}">
        <div class="relative ap bg-gray-100">
          <div class="absolute inset-0 flex overflow-x-auto snap-x snap-mandatory sc" style="scrollbar-width:none" @scroll="i=Math.round($el.scrollLeft/$el.clientWidth)">
            <template x-for="(im,n) in (p.imagens||[])" :key="n"><img :src="im" :alt="p.nome" class="w-full h-full object-cover flex-none snap-center" loading="lazy"></template>
          </div>
          <button @click="falar(p.nome+'. '+(p.descricao||''))" class="absolute top-3 right-3 bg-rose-600 text-white px-3 h-10 rounded-full shadow-lg ring-2 ring-white flex items-center gap-1 text-[11px] font-bold z-10" aria-label="Ouvir descrição"><i class="fa-solid fa-volume-high"></i>Ouvir</button>
          <button x-show="user" @click="linkProd(p)" class="absolute top-3 left-3 bg-gray-900 text-white w-10 h-10 rounded-full z-10" aria-label="Link afiliado"><i class="fa-solid fa-share-nodes text-xs"></i></button>
          <div x-show="(p.imagens||[]).length>1" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-10">
            <template x-for="(im,n) in (p.imagens||[])" :key="n"><span :class="i===n?'bg-rose-600 w-4':'bg-white/80 w-1.5'" class="h-1.5 rounded-full transition-all"></span></template>
          </div>
        </div>
        <div class="p-4 space-y-3 flex-1 flex flex-col justify-between">
          <h2 class="font-bold" x-text="p.nome"></h2>
          <div class="space-y-2 text-[11px]">
            <div class="flex justify-between items-center"><b class="text-gray-600">Tamanho</b>
              <div class="flex gap-1"><template x-for="t in (p.tamanhos||[])" :key="t"><button @click="tam=t" :class="tam===t?'bg-rose-600 text-white':'bg-gray-100'" class="px-2 py-0.5 rounded-md" x-text="t"></button></template></div></div>
            <div class="flex justify-between items-center"><b class="text-gray-600">Cor</b>
              <div class="flex gap-1"><template x-for="c in (p.cores||[])" :key="c"><button @click="cor=c" :class="cor===c?'border-rose-600 text-rose-600 font-bold':'border-gray-200'" class="px-2 py-0.5 rounded-md border bg-white" x-text="c"></button></template></div></div>
          </div>
          <div>
            <span class="text-xl font-extrabold" x-text="brl(p.preco)"></span>
            <button @click="add(p,cor,tam)" class="w-full mt-2 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl"><i class="fa-solid fa-cart-plus mr-1"></i>Comprar</button>
          </div>
        </div>
        <div x-show="user&&user.admin" class="bg-gray-900 p-2 flex gap-1 text-[10px] text-white">
          <button @click="editar(p)" class="bg-blue-600 px-2 py-1 rounded font-bold">Editar</button>
          <button @click="promover(p)" class="bg-amber-500 px-2 py-1 rounded font-bold"><i class="fa-solid fa-bullhorn mr-1"></i>Promoção</button>
          <button @click="excluir(p.id)" class="bg-red-600 px-2 py-1 rounded font-bold">Excluir</button>
        </div>
      </article>
    </template>
  </div>
</main>

<!-- CARRINHO -->
<div x-show="carrinho" x-cloak class="fixed inset-0 z-50 bg-black/60 flex justify-end" @click.self="carrinho=false">
  <div class="bg-white w-full max-w-md h-full flex flex-col">
    <div class="p-4 bg-gray-900 text-white flex justify-between"><b>Carrinho</b><button @click="carrinho=false"><i class="fa-solid fa-xmark text-xl"></i></button></div>
    <div class="p-4 overflow-y-auto flex-1 space-y-4">
      <p x-show="!itens.length" class="text-center text-gray-400 py-12 text-sm">Seu carrinho está vazio.</p>
      <template x-for="(it,n) in itens" :key="n">
        <div class="flex items-center gap-3 border-b pb-3">
          <img :src="it.img" class="w-16 h-16 object-cover rounded-xl">
          <div class="flex-1 text-xs">
            <b x-text="it.nome"></b>
            <p class="text-gray-500" x-text="'Tam '+it.tam+' • '+it.cor"></p>
            <p class="font-bold text-rose-600" x-text="brl(it.preco*it.qtd)"></p>
            <div class="flex items-center gap-2 mt-1">
              <button @click="qtd(n,-1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold">-</button><b x-text="it.qtd"></b>
              <button @click="qtd(n,1)" class="w-6 h-6 bg-gray-100 rounded-lg font-bold">+</button>
            </div>
          </div>
          <button @click="itens.splice(n,1);salvarCar()" class="text-gray-400"><i class="fa-solid fa-trash-can"></i></button>
        </div>
      </template>
      <div x-show="itens.length" class="bg-gray-50 p-4 rounded-2xl border space-y-2">
        <h4 class="font-bold text-xs"><i class="fa-solid fa-location-dot text-rose-600 mr-1"></i>Entrega</h4>
        <div class="grid grid-cols-2 gap-2">
          <input x-model="end.nome" placeholder="Nome completo" class="p-2 border rounded-xl text-xs">
          <input x-model="end.email" type="email" placeholder="E-mail" class="p-2 border rounded-xl text-xs">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <input x-model="end.cep" @input="cep()" placeholder="CEP" inputmode="numeric" class="p-2 border rounded-xl text-xs">
          <input x-model="end.rua" placeholder="Rua" class="p-2 border rounded-xl text-xs col-span-2">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <input x-model="end.numero" placeholder="Nº" class="p-2 border rounded-xl text-xs">
          <input x-model="end.bairro" placeholder="Bairro" class="p-2 border rounded-xl text-xs col-span-2">
        </div>
        <div class="grid grid-cols-3 gap-2">
          <input x-model="end.cidade" placeholder="Cidade" class="p-2 border rounded-xl text-xs col-span-2">
          <input x-model="end.uf" maxlength="2" placeholder="UF" class="p-2 border rounded-xl text-xs uppercase">
        </div>
      </div>
    </div>
    <div class="p-4 border-t bg-gray-50 space-y-2" x-show="itens.length">
      <div class="flex justify-between text-xs"><span>Subtotal</span><b x-text="brl(subtotal())"></b></div>
      <div class="flex justify-between text-xs"><span>Frete</span><b x-text="brl(frete)"></b></div>
      <div class="flex justify-between"><b>Total</b><b class="text-xl text-rose-600" x-text="brl(subtotal()+frete)"></b></div>
      <button @click="pagar()" :disabled="pagando" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-bold text-xs rounded-xl"><i class="fa-solid fa-lock mr-1"></i><span x-text="pagando?'Aguarde...':'PAGAR COM MERCADO PAGO'"></span></button>
    </div>
  </div>
</div>

<!-- CONTA / ADMIN -->
<div x-show="conta" x-cloak class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-3xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
      <div><b x-text="user?'Sua Conta':(modo==='login'?'Entrar':'Criar Conta')"></b><p class="text-xs text-gray-400" x-text="user?user.email:''"></p></div>
      <button @click="conta=false"><i class="fa-solid fa-xmark text-2xl"></i></button>
    </div>
    <div x-show="user" class="flex border-b bg-gray-50 text-xs overflow-x-auto">
      <button @click="aba='afiliado'" :class="aba==='afiliado'?'border-b-2 border-rose-600 text-rose-600 bg-white':''" class="px-5 py-3 font-semibold">Afiliado (ganhos)</button>
      <template x-if="user&&user.admin"><div class="flex">
        <button @click="aba='produtos'" :class="aba==='produtos'?'border-b-2 border-rose-600 text-rose-600 bg-white':''" class="px-5 py-3 font-semibold">Produto</button>
        <button @click="aba='paginas'" :class="aba==='paginas'?'border-b-2 border-rose-600 text-rose-600 bg-white':''" class="px-5 py-3 font-semibold">Páginas</button>
        <button @click="aba='loja';carregarAj()" :class="aba==='loja'?'border-b-2 border-rose-600 text-rose-600 bg-white':''" class="px-5 py-3 font-semibold">Loja</button>
      </div></template>
      <button @click="sair()" class="px-5 py-3 text-red-500 font-semibold ml-auto">Sair</button>
    </div>
    <div class="p-6 overflow-y-auto flex-1 text-xs">
      <!-- login/cadastro -->
      <div x-show="!user" class="max-w-sm mx-auto space-y-3">
        <input x-show="modo==='cadastro'" x-model="f.nome" placeholder="Nome completo" class="w-full p-3 border rounded-xl text-sm">
        <input x-model="f.email" type="email" placeholder="E-mail" class="w-full p-3 border rounded-xl text-sm">
        <input x-model="f.senha" type="password" placeholder="Senha (mín. 6)" class="w-full p-3 border rounded-xl text-sm" @keyup.enter="entrar()">
        <p x-show="erro" class="text-red-600" x-text="erro"></p>
        <button @click="entrar()" class="w-full py-3 bg-rose-600 text-white font-bold rounded-xl" x-text="ocupado?'Aguarde...':(modo==='login'?'Entrar':'Cadastrar')" :disabled="ocupado"></button>
        <p class="text-center text-gray-600" x-show="modo==='login'">Sem conta? <button @click="modo='cadastro';erro=''" class="text-rose-600 font-bold underline">Criar conta</button></p>
        <p class="text-center text-gray-600" x-show="modo==='cadastro'">Já tem conta? <button @click="modo='login';erro=''" class="text-rose-600 font-bold underline">Entrar</button></p>
      </div>
      <!-- afiliado -->
      <div x-show="user&&aba==='afiliado'" class="space-y-3">
        <div class="bg-purple-50 border p-4 rounded-2xl"><span class="text-[10px] font-bold text-purple-800 uppercase">Seu código</span><p class="text-lg font-mono font-bold text-purple-600" x-text="user&&user.codigo"></p></div>
        <div class="grid grid-cols-3 gap-2 text-center"><div class="bg-blue-50 border p-3 rounded-2xl"><span class="text-[10px] font-bold text-blue-800 uppercase">Cliques</span><p class="text-lg font-bold text-blue-600" x-text="af.cliques"></p></div><div class="bg-amber-50 border p-3 rounded-2xl"><span class="text-[10px] font-bold text-amber-800 uppercase">Vendas</span><p class="text-lg font-bold text-amber-600" x-text="af.vendas"></p></div><div class="bg-emerald-50 border p-3 rounded-2xl"><span class="text-[10px] font-bold text-emerald-800 uppercase">Ganhos</span><p class="text-lg font-bold text-emerald-600" x-text="brl(af.comissao)"></p></div></div>
        <div class="flex gap-2"><input readonly :value="user?location.origin+'?ref='+user.codigo:''" class="w-full p-2.5 border rounded-xl font-mono"><button @click="copiar(location.origin+'?ref='+user.codigo)" class="px-4 bg-gray-900 text-white font-bold rounded-xl">Copiar</button></div>
      </div>
      <!-- produtos (admin) -->
      <div x-show="user&&user.admin&&aba==='produtos'" class="space-y-2">
        <b x-text="pf.id?'Editar produto':'Novo produto'"></b>
        <div class="grid grid-cols-2 gap-2"><input x-model="pf.nome" placeholder="Nome" class="p-2 border rounded-xl"><input x-model.number="pf.preco" type="number" step="0.01" placeholder="Preço" class="p-2 border rounded-xl"></div>
        <div class="grid grid-cols-2 gap-2"><input x-model="pf.tamanhos" placeholder="Tamanhos: P,M,G" class="p-2 border rounded-xl"><input x-model="pf.cores" placeholder="Cores: Rosa,Preto" class="p-2 border rounded-xl"></div>
        <textarea x-model="pf.descricao" placeholder="Descrição" class="w-full p-2 border rounded-xl h-16"></textarea>
        <template x-for="n in [0,1,2,3,4]" :key="n"><input x-model="pf.imagens[n]" :placeholder="'URL da imagem '+(n+1)+(n===0?' (principal)':' (opcional)')" class="w-full p-2 border rounded-xl"></template>
        <label class="block"><span class="text-gray-600">ou envie foto do celular (vai para o R2)</span><input type="file" accept="image/*" multiple @change="subir($event)" class="block w-full mt-1"></label>
        <div class="flex gap-2"><button @click="salvarProd()" class="flex-1 py-2.5 bg-gray-900 text-white font-bold rounded-xl">Salvar produto</button><button x-show="pf.id" @click="zerarPf()" class="px-4 bg-gray-200 rounded-xl">Cancelar</button></div>
      </div>
      <!-- páginas (admin) -->
      <div x-show="user&&user.admin&&aba==='paginas'" class="space-y-2">
        <input x-model="nf.titulo" placeholder="Título" class="w-full p-2 border rounded-xl">
        <input x-model="nf.imagem" placeholder="URL da imagem" class="w-full p-2 border rounded-xl">
        <textarea x-model="nf.descricao" placeholder="Conteúdo" class="w-full p-2 border rounded-xl h-20"></textarea>
        <input x-model="nf.link" placeholder="Link do botão (opcional)" class="w-full p-2 border rounded-xl">
        <button @click="salvarPag()" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl">Criar página</button>
        <template x-for="p in paginas" :key="p.id"><div class="p-3 border rounded-xl flex justify-between"><b x-text="p.titulo"></b><button @click="excluirPag(p.id)" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button></div></template>
      </div>
      <!-- loja (admin) -->
      <div x-show="user&&user.admin&&aba==='loja'" class="space-y-2">
        <input x-model="cfg.nomeLoja" placeholder="Nome da loja" class="w-full p-2 border rounded-xl">
        <input x-model="cfg.logo" placeholder="URL do logo" class="w-full p-2 border rounded-xl">
        <input x-model="cfg.banner" placeholder="URL do banner" class="w-full p-2 border rounded-xl">
        <label class="flex items-center gap-2 font-semibold"><input type="checkbox" x-model="cfg.popupAtivo"> Pop-up ativo</label>
        <div class="grid grid-cols-2 gap-2"><input x-model="cfg.popupTag" placeholder="Tag" class="p-2 border rounded-xl"><input x-model="cfg.popupTitulo" placeholder="Título" class="p-2 border rounded-xl"></div>
        <input x-model="cfg.popupImagem" placeholder="URL imagem pop-up" class="w-full p-2 border rounded-xl">
        <textarea x-model="cfg.popupTexto" placeholder="Texto" class="w-full p-2 border rounded-xl h-16"></textarea>
        
        <button @click="salvarCfg()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">Salvar loja</button>
        <div class="border-t pt-3 mt-3 space-y-2">
          <b>Mercado Pago</b>
          <input x-model="aj.mpPublicKey" placeholder="Public Key" class="w-full p-2 border rounded-xl">
          <input x-model="aj.mpToken" type="password" :placeholder="aj.mpTokenOk?'Access Token (já salvo — deixe vazio para manter)':'Access Token'" class="w-full p-2 border rounded-xl">
          <b>Frete</b>
          <select x-model="aj.freteEmpresa" class="w-full p-2 border rounded-xl bg-white"><option value="superfrete">Super Frete</option><option value="melhorenvio">Melhor Envio</option><option value="frenet">Frenet</option><option value="correios">Correios</option></select>
          <input x-model="aj.freteToken" type="password" :placeholder="aj.freteTokenOk?'Token do frete (já salvo — deixe vazio para manter)':'Token da API de frete'" class="w-full p-2 border rounded-xl">
          <b>Endereço da loja (origem do frete)</b>
          <div class="grid grid-cols-3 gap-2"><input x-model="aj.enderecoLoja.cep" placeholder="CEP" class="p-2 border rounded-xl"><input x-model="aj.enderecoLoja.rua" placeholder="Rua" class="p-2 border rounded-xl col-span-2"></div>
          <div class="grid grid-cols-3 gap-2"><input x-model="aj.enderecoLoja.numero" placeholder="Nº" class="p-2 border rounded-xl"><input x-model="aj.enderecoLoja.bairro" placeholder="Bairro" class="p-2 border rounded-xl col-span-2"></div>
          <div class="grid grid-cols-3 gap-2"><input x-model="aj.enderecoLoja.cidade" placeholder="Cidade" class="p-2 border rounded-xl col-span-2"><input x-model="aj.enderecoLoja.uf" maxlength="2" placeholder="UF" class="p-2 border rounded-xl uppercase"></div>
          <button @click="salvarAj()" class="w-full py-3 bg-gray-900 text-white font-bold rounded-xl">Salvar pagamento e frete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-white border-t py-8 mt-16 text-center text-xs text-gray-500"><b class="text-gray-800" x-text="cfg.nomeLoja+' © '+new Date().getFullYear()"></b></footer>

<script>
const API='https://dridalia-api.bmlimp8.workers.dev/api/';
function loja(){return{
  cfg:{nomeLoja:'Dridalia Moda Feminina',logo:'',banner:'',popupAtivo:false,popupTag:'',popupTitulo:'',popupTexto:'',popupImagem:'',popupProdutoId:null},
  produtos:[],paginas:[],user:null,carregando:true,
  menu:false,pag:null,conta:false,carrinho:false,popup:true,modo:'login',aba:'afiliado',erro:'',pagando:false,ocupado:false,
  f:{nome:'',email:'',senha:''},itens:[],frete:15,
  end:{nome:'',email:'',cep:'',rua:'',numero:'',bairro:'',cidade:'',uf:''},
  pf:{id:null,nome:'',preco:null,descricao:'',tamanhos:'P,M,G,GG',cores:'',imagens:['','','','','']},
  nf:{titulo:'',imagem:'',descricao:'',link:''},
  af:{cliques:0,vendas:0,comissao:0},
  aj:{mpPublicKey:'',mpToken:'',mpTokenOk:false,freteEmpresa:'superfrete',freteToken:'',freteTokenOk:false,enderecoLoja:{cep:'',rua:'',numero:'',bairro:'',cidade:'',uf:''}},
  politicas:[
    {titulo:'Política de Privacidade',descricao:'Respeitamos a sua privacidade e usamos seus dados apenas para processar pedidos e atendimento.'},
    {titulo:'Frete e Entrega',descricao:'Enviamos para todo o Brasil via Super Frete e Correios, em até 24h úteis após a confirmação do pagamento.'},
    {titulo:'Trocas e Devoluções',descricao:'Você tem até 7 dias corridos após o recebimento para solicitar troca ou devolução.'}],

  async api(path,method='GET',body){
    const h={};const t=localStorage.getItem('dri_token');if(t)h.authorization='Bearer '+t;
    let b;if(body instanceof File){b=body;h['content-type']=body.type}else if(body){b=JSON.stringify(body);h['content-type']='application/json'}
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);let r;
    try{r=await fetch(API+path,{method,headers:h,body:b,signal:ac.signal})}catch(e){throw new Error(e.name==='AbortError'?'Demorou demais. Tente de novo.':'Sem conexão com o servidor.')}finally{clearTimeout(to)}
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.erro||'Erro '+r.status);return d},

  async init(){
    try{this.itens=JSON.parse(localStorage.getItem('dri_car')||'[]');this.end=JSON.parse(localStorage.getItem('dri_end')||'null')||this.end}catch(e){}
    const q=new URLSearchParams(location.search);if(q.get('ref'))localStorage.setItem('dri_ref',q.get('ref'));
    try{const d=await this.api('store');this.produtos=d.produtos;this.paginas=d.paginas;Object.assign(this.cfg,d.config);this.frete=d.frete??15}catch(e){console.error(e)}
    this.carregando=false;
    if(localStorage.getItem('dri_token')){try{this.user=(await this.api('me')).user}catch(e){localStorage.removeItem('dri_token')}}
    this.api('click','POST',{ref:q.get('ref'),prod:q.get('prod')}).catch(()=>{});
  },
  brl(v){return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})},
  // auth
  async entrar(){if(this.ocupado)return;this.erro='';this.ocupado=true;try{
    const d=await this.api(this.modo==='login'?'login':'register','POST',this.f);
    localStorage.setItem('dri_token',d.token);this.user=d.user;this.f={nome:'',email:'',senha:''};this.aba='afiliado'}catch(e){this.erro=e.message}this.ocupado=false},
  async sair(){try{await this.api('logout','POST')}catch(e){}localStorage.removeItem('dri_token');this.user=null;this.conta=false},
  // carrinho
  add(p,cor,tam){const i=this.itens.findIndex(x=>x.id===p.id&&x.cor===cor&&x.tam===tam);
    if(i>-1)this.itens[i].qtd++;else this.itens.push({id:p.id,nome:p.nome,preco:p.preco,img:(p.imagens||[])[0],cor:cor||'Padrão',tam:tam||'Único',qtd:1});
    this.salvarCar();this.carrinho=true},
  qtd(n,v){this.itens[n].qtd+=v;if(this.itens[n].qtd<=0)this.itens.splice(n,1);this.salvarCar()},
  qtdTotal(){return this.itens.reduce((a,i)=>a+i.qtd,0)},
  subtotal(){return this.itens.reduce((a,i)=>a+i.preco*i.qtd,0)},
  salvarCar(){localStorage.setItem('dri_car',JSON.stringify(this.itens))},
  async cep(){const c=this.end.cep.replace(/\D/g,'');if(c.length!==8)return;
    try{const d=await (await fetch('https://viacep.com.br/ws/'+c+'/json/')).json();if(!d.erro)Object.assign(this.end,{rua:d.logradouro,bairro:d.bairro,cidade:d.localidade,uf:d.uf})}catch(e){}},
  async pagar(){const e=this.end;
    if(!e.nome||!e.email||!e.cep||!e.rua||!e.numero||!e.cidade||!e.uf)return alert('Preencha o endereço de entrega.');
    this.pagando=true;localStorage.setItem('dri_end',JSON.stringify(e));
    try{const d=await this.api('checkout','POST',{itens:this.itens.map(i=>({id:i.id,qtd:i.qtd,cor:i.cor,tam:i.tam})),endereco:e,ref:localStorage.getItem('dri_ref')});
      location.href=d.url}catch(x){alert(x.message);this.pagando=false}},
  // admin
  zerarPf(){this.pf={id:null,nome:'',preco:null,descricao:'',tamanhos:'P,M,G,GG',cores:'',imagens:['','','','','']}},
  editar(p){this.pf={...p,tamanhos:(p.tamanhos||[]).join(','),cores:(p.cores||[]).join(','),imagens:[...(p.imagens||[]),'','','','',''].slice(0,5)};this.aba='produtos';this.conta=true},
  async subir(ev){for(const f of ev.target.files){if(this.pf.imagens.findIndex(x=>!x)<0)break;
    try{const d=await this.api('upload','POST',f);{const i=this.pf.imagens.findIndex(x=>!x);this.pf.imagens[i]=d.url}}catch(e){alert(e.message)}}ev.target.value=''},
  async salvarProd(){const l=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
    if(!this.pf.nome||!this.pf.preco||!this.pf.imagens.some(x=>x&&x.trim()))return alert('Informe nome, preço e ao menos 1 foto.');
    try{await this.api('product','POST',{...this.pf,imagens:this.pf.imagens.map(x=>(x||'').trim()).filter(Boolean),tamanhos:l(this.pf.tamanhos),cores:l(this.pf.cores)});await this.recarregar();this.zerarPf();alert('Produto salvo!')}catch(e){alert(e.message)}},
  async excluir(id){if(!confirm('Excluir produto?'))return;try{await this.api('product/'+id,'DELETE');await this.recarregar()}catch(e){alert(e.message)}},
  async salvarPag(){if(!this.nf.titulo||!this.nf.descricao)return alert('Informe título e conteúdo.');
    try{await this.api('page','POST',this.nf);this.nf={titulo:'',imagem:'',descricao:'',link:''};await this.recarregar()}catch(e){alert(e.message)}},
  async excluirPag(id){try{await this.api('page/'+id,'DELETE');await this.recarregar()}catch(e){alert(e.message)}},
  async salvarCfg(){try{await this.api('config','POST',this.cfg);alert('Loja salva!')}catch(e){alert(e.message)}},
  async recarregar(){const d=await this.api('store');this.produtos=d.produtos;this.paginas=d.paginas},
  promo(){return this.produtos.find(x=>x.id==this.cfg.popupProdutoId)},
  async promover(p){if(!confirm('Mostrar "'+p.nome+'" no pop-up de promoção?'))return;
    try{await this.api('config','POST',{popupProdutoId:p.id,popupAtivo:true});this.cfg.popupProdutoId=p.id;this.cfg.popupAtivo=true;this.popup=true}catch(e){alert(e.message)}},
  async carregarAf(){try{this.af=await this.api('afiliado')}catch(e){}},
  async carregarAj(){try{const d=await this.api('ajustes');this.aj={...this.aj,...d,enderecoLoja:{...this.aj.enderecoLoja,...(d.enderecoLoja||{})},mpToken:'',freteToken:''}}catch(e){}},
  async salvarAj(){const a=this.aj;try{await this.api('ajustes','POST',{mpPublicKey:a.mpPublicKey,mpToken:a.mpToken,freteEmpresa:a.freteEmpresa,freteToken:a.freteToken,enderecoLoja:a.enderecoLoja});alert('Salvo!');await this.carregarAj()}catch(e){alert(e.message)}},
  abrirPag(p){this.menu=false;this.pag=p},
  linkProd(p){this.copiar(location.origin+'?prod='+p.id+'&ref='+this.user.codigo)},
  copiar(t){navigator.clipboard.writeText(t);alert('Link copiado!')},
  falar(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const m=new SpeechSynthesisUtterance(t);m.lang='pt-BR';speechSynthesis.speak(m)}
}}
</script>
</body>
</html>
